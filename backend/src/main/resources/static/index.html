<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDSIM — 개원 시뮬레이션</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --bg: #0a0e1a;
          --surface: #111827;
          --surface2: #1a2235;
          --border: rgba(255,255,255,0.07);
          --border2: rgba(255,255,255,0.12);
          --accent: #3b82f6;
          --accent2: #60a5fa;
          --success: #10b981;
          --warning: #f59e0b;
          --danger: #ef4444;
          --text: #f1f5f9;
          --text2: #94a3b8;
          --text3: #475569;
          --mono: 'DM Mono', monospace;
          --sans: 'Pretendard', sans-serif;
        }

        body {
          font-family: var(--sans);
          background: var(--bg);
          color: var(--text);
          min-height: 100vh;
          overflow-x: hidden;
        }

        /* 배경 그리드 */
        body::before {
          content: '';
          position: fixed;
          inset: 0;
          background-image:
            linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
          background-size: 40px 40px;
          pointer-events: none;
          z-index: 0;
        }

        /* ── 헤더 ── */
        header {
          position: sticky; top: 0; z-index: 100;
          background: rgba(10,14,26,0.85);
          backdrop-filter: blur(12px);
          border-bottom: 1px solid var(--border);
          padding: 0 32px;
          height: 56px;
          display: flex; align-items: center; justify-content: space-between;
        }

        .logo {
          font-family: var(--mono);
          font-size: 15px;
          font-weight: 500;
          color: var(--accent2);
          letter-spacing: 0.08em;
        }

        .logo span { color: var(--text3); margin: 0 6px; }

        .header-badge {
          font-family: var(--mono);
          font-size: 11px;
          color: var(--text3);
          background: var(--surface2);
          border: 1px solid var(--border);
          padding: 3px 10px;
          border-radius: 4px;
        }

        /* ── 레이아웃 ── */
        .layout {
          position: relative; z-index: 1;
          display: grid;
          grid-template-columns: 380px 1fr;
          min-height: calc(100vh - 56px);
        }

        /* ── 사이드바 (입력 폼) ── */
        .sidebar {
          background: var(--surface);
          border-right: 1px solid var(--border);
          padding: 28px 24px;
          overflow-y: auto;
          max-height: calc(100vh - 56px);
          position: sticky;
          top: 56px;
        }

        .sidebar-title {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.12em;
          color: var(--text3);
          text-transform: uppercase;
          margin-bottom: 20px;
        }

        .section-label {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.1em;
          color: var(--accent);
          text-transform: uppercase;
          margin: 24px 0 12px;
          display: flex; align-items: center; gap: 8px;
        }

        .section-label::after {
          content: '';
          flex: 1;
          height: 1px;
          background: var(--border);
        }

        .field { margin-bottom: 12px; }

        label {
          display: block;
          font-size: 12px;
          color: var(--text2);
          margin-bottom: 5px;
          font-weight: 500;
        }

        input, select {
          width: 100%;
          background: var(--surface2);
          border: 1px solid var(--border2);
          color: var(--text);
          font-family: var(--sans);
          font-size: 13px;
          padding: 8px 12px;
          border-radius: 6px;
          outline: none;
          transition: border-color 0.15s;
          appearance: none;
        }

        input:focus, select:focus { border-color: var(--accent); }
        input::placeholder { color: var(--text3); }

        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

        /* 인력 테이블 */
        .staff-table { width: 100%; border-collapse: collapse; }
        .staff-table th {
          font-size: 11px; color: var(--text3); font-weight: 500;
          padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--border);
        }
        .staff-table td { padding: 4px 6px; }
        .staff-table input { padding: 5px 8px; font-size: 12px; }

        /* 실행 버튼 */
        .btn-run {
          width: 100%;
          margin-top: 20px;
          padding: 12px;
          background: var(--accent);
          color: #fff;
          font-family: var(--sans);
          font-size: 14px;
          font-weight: 600;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          transition: all 0.15s;
          display: flex; align-items: center; justify-content: center; gap: 8px;
          letter-spacing: 0.02em;
        }

        .btn-run:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-run:active { transform: translateY(0); }
        .btn-run:disabled { background: var(--text3); cursor: not-allowed; transform: none; }

        /* ── 메인 패널 ── */
        .main {
          padding: 28px 32px;
          overflow-y: auto;
        }

        /* 초기 상태 */
        .empty-state {
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          color: var(--text3);
        }

        .empty-icon {
          font-size: 48px;
          opacity: 0.3;
        }

        .empty-state p { font-size: 14px; }

        /* 로딩 */
        .loading {
          display: none;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100%;
          gap: 16px;
          color: var(--text2);
        }

        .spinner {
          width: 36px; height: 36px;
          border: 2px solid var(--border2);
          border-top-color: var(--accent);
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* 결과 */
        .result { display: none; }

        .result-header {
          display: flex; align-items: baseline; justify-content: space-between;
          margin-bottom: 24px;
        }

        .result-title {
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 0.1em;
          color: var(--text3);
          text-transform: uppercase;
        }

        .result-meta {
          font-family: var(--mono);
          font-size: 11px;
          color: var(--text3);
        }

        /* KPI 카드 */
        .kpi-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 12px;
          margin-bottom: 24px;
        }

        .kpi-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 16px;
          position: relative;
          overflow: hidden;
          transition: border-color 0.2s;
        }

        .kpi-card:hover { border-color: var(--border2); }

        .kpi-card::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 2px;
          background: var(--accent);
        }

        .kpi-card.success::before { background: var(--success); }
        .kpi-card.warning::before { background: var(--warning); }
        .kpi-card.danger::before  { background: var(--danger); }

        .kpi-label {
          font-size: 11px;
          color: var(--text3);
          font-weight: 500;
          margin-bottom: 8px;
          letter-spacing: 0.04em;
        }

        .kpi-value {
          font-family: var(--mono);
          font-size: 24px;
          font-weight: 500;
          color: var(--text);
          line-height: 1;
        }

        .kpi-value.danger { color: var(--danger); }
        .kpi-value.success { color: var(--success); }

        .kpi-unit {
          font-size: 11px;
          color: var(--text3);
          margin-top: 4px;
        }

        /* 그래프 + 피드백 나란히 */
        .middle-row {
          display: grid;
          grid-template-columns: 1fr 300px;
          gap: 16px;
          margin-bottom: 24px;
          align-items: start;
        }

        /* 그래프 */
        .chart-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 20px;
        }

        .card-title {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.1em;
          color: var(--text3);
          text-transform: uppercase;
          margin-bottom: 16px;
        }

        /* KPI 피드백 */
        .feedback-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 20px;
        }

        .feedback-item {
          display: flex; gap: 10px; align-items: flex-start;
          padding: 10px 0;
          border-bottom: 1px solid var(--border);
          animation: fadeUp 0.4s ease both;
        }

        .feedback-item:last-child { border-bottom: none; padding-bottom: 0; }

        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(6px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .feedback-dot {
          width: 8px; height: 8px;
          border-radius: 50%;
          margin-top: 4px;
          flex-shrink: 0;
        }

        .feedback-dot.success { background: var(--success); }
        .feedback-dot.warning { background: var(--warning); }
        .feedback-dot.danger  { background: var(--danger); }

        .feedback-text {
          font-size: 12px;
          color: var(--text2);
          line-height: 1.5;
        }

        /* P&L 테이블 */
        .table-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 20px;
          overflow-x: auto;
        }

        .pl-table {
          width: 100%;
          border-collapse: collapse;
          font-size: 12px;
        }

        .pl-table th {
          font-family: var(--mono);
          font-size: 10px;
          color: var(--text3);
          font-weight: 500;
          padding: 6px 12px;
          text-align: right;
          border-bottom: 1px solid var(--border);
          white-space: nowrap;
        }

        .pl-table th:first-child { text-align: left; }

        .pl-table td {
          padding: 7px 12px;
          text-align: right;
          border-bottom: 1px solid var(--border);
          font-family: var(--mono);
          font-size: 12px;
          color: var(--text2);
          white-space: nowrap;
        }

        .pl-table td:first-child {
          text-align: left;
          color: var(--text3);
          font-family: var(--sans);
          font-size: 12px;
        }

        .pl-table tr:last-child td { border-bottom: none; }
        .pl-table tr:hover td { background: rgba(255,255,255,0.02); }

        .pl-table .positive { color: var(--accent2); font-weight: 500; }
        .pl-table .negative { color: var(--danger); }
        .pl-table .separator td {
          padding: 2px 0;
          background: var(--border);
          height: 1px;
        }

        /* 에러 토스트 */
        .toast {
          position: fixed; bottom: 24px; right: 24px;
          background: var(--danger);
          color: #fff;
          padding: 12px 18px;
          border-radius: 8px;
          font-size: 13px;
          z-index: 999;
          display: none;
          animation: fadeUp 0.3s ease;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">MED<span>//</span>SIM</div>
    <div class="header-badge">demo · localhost:8080</div>
</header>

<div class="layout">

    <!-- ── 사이드바 ── -->
    <aside class="sidebar">
        <div class="sidebar-title">시뮬레이션 입력</div>

        <div class="section-label">진료과목</div>
        <div class="field">
            <label>진료과목</label>
            <select id="deptCategory">
                <option value="내과">내과</option>
                <option value="소아청소년과">소아청소년과</option>
                <option value="피부과" selected>피부과</option>
                <option value="정형외과">정형외과</option>
                <option value="이비인후과">이비인후과</option>
                <option value="안과">안과</option>
            </select>
        </div>

        <div class="section-label">상권</div>
        <div class="field">
            <label>시/군/구</label>
            <input type="text" id="regionSiGun" placeholder="예: 강남구" value="강남구">
        </div>

        <div class="section-label">자금 계획</div>
        <div class="field">
            <label>초기 투자금 (만원)</label>
            <input type="number" id="initialInvestment" value="30000">
        </div>
        <div class="row3">
            <div class="field">
                <label>대출금액 (만원)</label>
                <input type="number" id="loanAmount" value="10000">
            </div>
            <div class="field">
                <label>연이율 (%)</label>
                <input type="number" id="loanRate" value="4.5" step="0.1">
            </div>
            <div class="field">
                <label>상환기간 (개월)</label>
                <input type="number" id="loanMonths" value="36">
            </div>
        </div>

        <div class="section-label">월 운영비</div>
        <div class="row2">
            <div class="field">
                <label>월 임대료 (만원)</label>
                <input type="number" id="monthlyRent" value="500">
            </div>
            <div class="field">
                <label>월 마케팅비 (만원)</label>
                <input type="number" id="monthlyMarketing" value="200">
            </div>
        </div>

        <div class="section-label">인력 구성</div>
        <table class="staff-table">
            <thead>
            <tr>
                <th>직종</th>
                <th>인원</th>
                <th>월 급여(만원)</th>
            </tr>
            </thead>
            <tbody id="staffBody">
            <tr>
                <td><input type="text" value="간호사"></td>
                <td><input type="number" value="2" style="width:60px"></td>
                <td><input type="number" value="300"></td>
            </tr>
            <tr>
                <td><input type="text" value="원무행정"></td>
                <td><input type="number" value="1" style="width:60px"></td>
                <td><input type="number" value="250"></td>
            </tr>
            </tbody>
        </table>

        <button class="btn-run" id="btnRun" onclick="runSimulation()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            시뮬레이션 실행
        </button>
    </aside>

    <!-- ── 메인 패널 ── -->
    <main class="main" id="mainPanel">

        <!-- 초기 상태 -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">◎</div>
            <p>입력값을 설정하고 시뮬레이션을 실행하세요</p>
        </div>

        <!-- 로딩 -->
        <div class="loading" id="loadingState">
            <div class="spinner"></div>
            <span style="font-size:13px">3년 개원 시뮬레이션 중...</span>
        </div>

        <!-- 결과 -->
        <div class="result" id="resultPanel">

            <div class="result-header">
                <div class="result-title">시뮬레이션 결과</div>
                <div class="result-meta" id="resultMeta"></div>
            </div>

            <!-- KPI 카드 -->
            <div class="kpi-grid">
                <div class="kpi-card" id="card-bep">
                    <div class="kpi-label">BEP 달성 시점</div>
                    <div class="kpi-value" id="val-bep">—</div>
                    <div class="kpi-unit">개월</div>
                </div>
                <div class="kpi-card" id="card-fcr">
                    <div class="kpi-label">고정비 비율 (3년 평균)</div>
                    <div class="kpi-value" id="val-fcr">—</div>
                    <div class="kpi-unit">%</div>
                </div>
                <div class="kpi-card" id="card-cash">
                    <div class="kpi-label">3년차 기말 현금잔고</div>
                    <div class="kpi-value" id="val-cash">—</div>
                    <div class="kpi-unit">만원</div>
                </div>
                <div class="kpi-card" id="card-btr">
                    <div class="kpi-label">BEP 목표 월 매출</div>
                    <div class="kpi-value" id="val-btr">—</div>
                    <div class="kpi-unit">만원/월</div>
                </div>
                <div class="kpi-card" id="card-pgr">
                    <div class="kpi-label">환자수 증가율 (M1→M36)</div>
                    <div class="kpi-value" id="val-pgr">—</div>
                    <div class="kpi-unit">%</div>
                </div>
                <div class="kpi-card" id="card-cpa">
                    <div class="kpi-label">마케팅 CPA</div>
                    <div class="kpi-value" id="val-cpa">—</div>
                    <div class="kpi-unit">만원/신환 1명</div>
                </div>
            </div>

            <!-- 그래프 + 피드백 -->
            <div class="middle-row">
                <div class="chart-card">
                    <div class="card-title">36개월 누적 손익 교차</div>
                    <canvas id="lineChart" height="200"></canvas>
                </div>
                <div class="feedback-card">
                    <div class="card-title">KPI 피드백</div>
                    <div id="feedbackList"></div>
                </div>
            </div>

            <!-- P&L 테이블 -->
            <div class="table-card">
                <div class="card-title">손익계산서 + 현금흐름 — 기준월</div>
                <table class="pl-table">
                    <thead>
                    <tr id="plHead"></tr>
                    </thead>
                    <tbody id="plBody"></tbody>
                </table>
            </div>

        </div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
    let chartInstance = null;

    async function runSimulation() {
      const btn = document.getElementById('btnRun');
      btn.disabled = true;

      // 상태 전환
      show('loadingState');
      hide('emptyState');
      hide('resultPanel');

      // 입력값 수집
      const staffRows = document.querySelectorAll('#staffBody tr');
      const staffList = [];
      staffRows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        const role   = inputs[0].value.trim();
        const count  = parseInt(inputs[1].value) || 0;
        const salary = parseInt(inputs[2].value) || 0;
        if (role && count > 0) staffList.push({ role, count, salary });
      });

      const body = {
        deptCategory:      document.getElementById('deptCategory').value,
        regionSiGun:       document.getElementById('regionSiGun').value,
        initialInvestment: parseInt(document.getElementById('initialInvestment').value) || 0,
        loanAmount:        parseInt(document.getElementById('loanAmount').value) || null,
        loanRate:          parseFloat(document.getElementById('loanRate').value) || null,
        loanMonths:        parseInt(document.getElementById('loanMonths').value) || null,
        monthlyRent:       parseInt(document.getElementById('monthlyRent').value) || 0,
        monthlyMarketing:  parseInt(document.getElementById('monthlyMarketing').value) || 0,
        staffList
      };

      try {
        const res = await fetch('/api/simulation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderResult(data, body.deptCategory, body.regionSiGun);

      } catch(e) {
        showToast('API 호출 실패: ' + e.message);
        show('emptyState');
        hide('loadingState');
      } finally {
        btn.disabled = false;
      }
    }

    function renderResult(data, dept, region) {
      hide('loadingState');
      hide('emptyState');
      show('resultPanel');

      // 메타
      document.getElementById('resultMeta').textContent =
        `${dept} · ${region} · ${new Date().toLocaleTimeString('ko-KR')}`;

      // KPI 카드
      const bep = data.bepMonth === 999 ? '36개월↑' : data.bepMonth;
      setKpi('bep',  bep,  data.bepMonth <= 6 ? 'success' : data.bepMonth <= 12 ? '' : 'danger', data.bepMonth === 999);
      setKpi('fcr',  data.fixedCostRatio, data.fixedCostRatio <= 40 ? 'success' : data.fixedCostRatio <= 59 ? '' : 'danger');
      setKpi('cash', fmt(data.finalCashBalance), data.finalCashBalance > 0 ? 'success' : 'danger', data.finalCashBalance < 0);
      setKpi('btr',  fmt(data.bepTargetRevenue), '');
      setKpi('pgr',  data.patientGrowthRate, data.patientGrowthRate >= 5 ? 'success' : '');
      setKpi('cpa',  data.marketingCpa === 0 ? '—' : data.marketingCpa, '');

      // 그래프
      renderChart(data.cumulativeRevenue, data.cumulativeCost, data.bepMonth);

      // 피드백
      const list = document.getElementById('feedbackList');
      list.innerHTML = '';
      data.kpiMessages.forEach((msg, i) => {
        const div = document.createElement('div');
        div.className = 'feedback-item';
        div.style.animationDelay = `${i * 0.08}s`;
        div.innerHTML = `
          <div class="feedback-dot ${msg.theme}"></div>
          <div class="feedback-text">${msg.message}</div>
        `;
        list.appendChild(div);
      });

      // P&L 테이블 (기준월)
      const months = [1, 6, 12, 18, 24, 36];
      const rows = months.map(m => data.monthly.find(d => d.month === m)).filter(Boolean);

      const head = document.getElementById('plHead');
      head.innerHTML = '<th>항목</th>' + rows.map(r => `<th>M${r.month}</th>`).join('');

      const fields = [
        { key: 'revenue',          label: '매출액',          type: 'pos' },
        { key: 'variableCost',     label: '변동비',           type: 'neg' },
        { key: 'fixedCost',        label: '고정비',           type: 'neg' },
        { key: 'operatingProfit',  label: '영업이익',         type: 'auto' },
        { key: 'interestExpense',  label: '이자비용',         type: 'neg' },
        { key: 'taxExpense',       label: '세금 (20%)',       type: 'neg' },
        { key: 'netProfit',        label: '당기순이익',       type: 'auto', bold: true },
        { key: null },
        { key: 'operatingCashFlow', label: '영업 현금흐름',   type: 'auto' },
        { key: 'investingCashFlow', label: '투자 현금흐름',   type: 'auto' },
        { key: 'financingCashFlow', label: '재무 현금흐름',   type: 'auto' },
        { key: 'cumulativeCash',   label: '누적 현금잔고',    type: 'auto', bold: true },
      ];

      const tbody = document.getElementById('plBody');
      tbody.innerHTML = '';
      fields.forEach(f => {
        if (!f.key) {
          const tr = document.createElement('tr');
          tr.className = 'separator';
          tr.innerHTML = `<td colspan="${rows.length + 1}"></td>`;
          tbody.appendChild(tr);
          return;
        }
        const tr = document.createElement('tr');
        const cells = rows.map(r => {
          const v = r[f.key];
          let cls = '';
          if (f.type === 'pos') cls = 'positive';
          else if (f.type === 'neg') cls = v !== 0 ? 'negative' : '';
          else if (f.type === 'auto') cls = v > 0 ? 'positive' : v < 0 ? 'negative' : '';
          return `<td class="${cls}">${fmt(v)}</td>`;
        }).join('');
        tr.innerHTML = `<td style="${f.bold ? 'font-weight:600;color:var(--text)' : ''}">${f.label}</td>${cells}`;
        tbody.appendChild(tr);
      });
    }

    function renderChart(revenue, cost, bepMonth) {
      const labels = Array.from({ length: 36 }, (_, i) => i % 6 === 0 || i === 35 ? `M${i+1}` : '');

      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: '누적 매출',
              data: revenue,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59,130,246,0.06)',
              borderWidth: 2,
              pointRadius: 0,
              fill: true,
              tension: 0.3
            },
            {
              label: '누적 비용',
              data: cost,
              borderColor: '#ef4444',
              backgroundColor: 'rgba(239,68,68,0.04)',
              borderWidth: 2,
              pointRadius: 0,
              fill: true,
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              labels: { color: '#94a3b8', font: { family: 'DM Mono', size: 11 }, boxWidth: 12 }
            },
            tooltip: {
              backgroundColor: '#1a2235',
              borderColor: 'rgba(255,255,255,0.1)',
              borderWidth: 1,
              titleColor: '#94a3b8',
              bodyColor: '#f1f5f9',
              titleFont: { family: 'DM Mono', size: 11 },
              bodyFont: { family: 'DM Mono', size: 12 },
              callbacks: {
                label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.raw)}만원`
              }
            },
            annotation: bepMonth && bepMonth !== 999 ? {
              annotations: {
                bep: {
                  type: 'line',
                  xMin: bepMonth - 1,
                  xMax: bepMonth - 1,
                  borderColor: '#10b981',
                  borderWidth: 1,
                  borderDash: [4, 4],
                  label: {
                    display: true,
                    content: `BEP M${bepMonth}`,
                    color: '#10b981',
                    font: { size: 10, family: 'DM Mono' },
                    backgroundColor: 'transparent'
                  }
                }
              }
            } : {}
          },
          scales: {
            x: {
              grid: { color: 'rgba(255,255,255,0.04)' },
              ticks: { color: '#475569', font: { family: 'DM Mono', size: 10 } }
            },
            y: {
              grid: { color: 'rgba(255,255,255,0.04)' },
              ticks: {
                color: '#475569',
                font: { family: 'DM Mono', size: 10 },
                callback: v => v >= 10000 ? `${(v/10000).toFixed(0)}억` : `${v.toLocaleString()}`
              }
            }
          }
        }
      });
    }

    function setKpi(id, value, theme, isNeg = false) {
      const card = document.getElementById(`card-${id}`);
      const val  = document.getElementById(`val-${id}`);
      card.className = `kpi-card ${theme}`;
      val.className  = `kpi-value ${isNeg ? 'danger' : theme === 'success' ? 'success' : ''}`;
      val.textContent = typeof value === 'number' ? value.toLocaleString() : value;
    }

    function fmt(n) {
      if (n === null || n === undefined) return '—';
      return n.toLocaleString('ko-KR');
    }

    function show(id) {
      const el = document.getElementById(id);
      el.style.display = id === 'loadingState' ? 'flex' : id === 'resultPanel' ? 'block' : 'flex';
    }

    function hide(id) {
      document.getElementById(id).style.display = 'none';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
</script>
</body>
</html>
