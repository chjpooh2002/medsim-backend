<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>시뮬레이션 구축 중 – MEDSIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        :root {
          --blue:#1A6BFF; --blue-dark:#0F4FCC; --navy:#0D1B2A;
          --gray-1:#F5F7FA; --gray-2:#E8ECF2; --gray-3:#C8D0DC;
          --gray-5:#7A8699; --white:#FFFFFF;
          --font:'Pretendard',-apple-system,sans-serif;
        }
        html, body { height:100%; }
        body { font-family:var(--font); color:var(--navy); background:var(--white); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }

        nav { background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--gray-2); height:60px; display:flex; align-items:center; padding:0 32px; }
        .nav-inner { width:100%; max-width:1100px; margin:0 auto; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
        .nav-left { display:flex; gap:28px; }
        .nav-left a { font-size:13px; font-weight:500; color:var(--gray-5); text-decoration:none; }
        .nav-logo { display:flex; align-items:center; justify-content:center; gap:7px; text-decoration:none; }
        .logo-icon { width:28px; height:28px; background:var(--blue); border-radius:7px; display:flex; align-items:center; justify-content:center; }
        .logo-icon svg { width:16px; height:16px; fill:white; }
        .logo-type { font-size:17px; font-weight:800; color:var(--navy); }
        .nav-right { display:flex; gap:8px; justify-content:flex-end; }
        .btn-outline { padding:7px 16px; border:1.5px solid var(--gray-3); border-radius:8px; font-size:13px; font-weight:600; color:var(--navy); background:transparent; text-decoration:none; display:inline-block; }
        .btn-solid { padding:7px 16px; border:none; border-radius:8px; font-size:13px; font-weight:600; color:white; background:var(--blue); text-decoration:none; display:inline-block; }

        /* LOADING AREA */
        main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; gap:24px; }

        .loading-badge { font-size:13px; font-weight:700; color:var(--blue); letter-spacing:.5px; }

        /* 스피너 */
        .spinner {
          width:72px; height:72px;
          border-radius:50%;
          border:6px solid var(--gray-2);
          border-top-color:var(--blue);
          animation:spin 1s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        .loading-title { font-size:26px; font-weight:800; color:var(--navy); letter-spacing:-.5px; }
        .loading-sub { font-size:14px; color:var(--gray-5); }

        /* 프로그레스 */
        .progress-wrap { width:320px; display:flex; flex-direction:column; gap:8px; }
        .progress-bar-bg { width:100%; height:6px; background:var(--gray-2); border-radius:3px; overflow:hidden; }
        .progress-bar-fill { height:100%; background:var(--blue); border-radius:3px; width:0%; animation:progress 3s ease forwards; }
        @keyframes progress { 0%{width:0%} 60%{width:70%} 90%{width:88%} 100%{width:95%} }
        .progress-label { font-size:12px; color:var(--gray-5); text-align:center; }

        /* 단계 목록 */
        .steps-list { display:flex; flex-direction:column; gap:8px; width:320px; }
        .step-item { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--gray-5); }
        .step-dot { width:8px; height:8px; border-radius:50%; background:var(--gray-3); flex-shrink:0; transition:background .3s; }
        .step-item.done .step-dot { background:var(--blue); }
        .step-item.done { color:var(--navy); font-weight:600; }
        .step-item.active .step-dot { background:var(--blue); animation:pulse .8s ease infinite; }
        .step-item.active { color:var(--blue); font-weight:600; }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:.6} }

        /* 하단 미리보기 플레이스홀더 */
        .preview-bar {
          width:100%; background:var(--gray-1); border-top:1px solid var(--gray-2);
          height:160px; display:flex; align-items:center; justify-content:center;
          position:relative; overflow:hidden;
        }
        .preview-bar::before, .preview-bar::after {
          content:''; position:absolute; background:rgba(200,208,220,.5); height:2px;
          width:141.4%; top:50%; left:-20.7%;
        }
        .preview-bar::before { transform:rotate(8deg); }
        .preview-bar::after  { transform:rotate(-8deg); }

        footer { background:var(--navy); padding:20px 32px; text-align:center; }
        footer p { font-size:12px; color:rgba(255,255,255,.4); }
    </style>
</head>
<body>
<nav>
    <div class="nav-inner">
        <div class="nav-left"><a href="../index.html">HOME</a><a href="#">ABOUT</a><a href="#">SERVICE</a></div>
        <a class="nav-logo" href="../index.html">
            <div class="logo-icon"><svg viewBox="0 0 20 20"><rect x="3" y="9" width="14" height="2" rx="1"/><rect x="9" y="3" width="2" height="14" rx="1"/></svg></div>
            <span class="logo-type">MEDSIM</span>
        </a>
        <div class="nav-right"><a class="btn-outline" href="../signup.html">회원가입</a><a class="btn-solid" href="../login.html">로그인</a></div>
    </div>
</nav>

<main>
    <p class="loading-badge">MEDSIM</p>
    <div class="spinner"></div>
    <p class="loading-title">시뮬레이션 구축 중입니다.</p>
    <p class="loading-sub">잠시만 기다려 주세요..</p>

    <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
        <p class="progress-label" id="progress-label">입력 데이터 처리 중...</p>
    </div>

    <div class="steps-list">
        <div class="step-item done"   id="s1"><div class="step-dot"></div> 입력 데이터 검증 완료</div>
        <div class="step-item done"   id="s2"><div class="step-dot"></div> 입지 분석 완료</div>
        <div class="step-item active" id="s3"><div class="step-dot"></div> 36개월 시뮬레이션 구축 중</div>
        <div class="step-item"        id="s4"><div class="step-dot"></div> 이벤트 시나리오 배치 중</div>
        <div class="step-item"        id="s5"><div class="step-dot"></div> AI 경영 코치 준비 중</div>
    </div>
</main>

<div class="preview-bar"></div>

<footer><p>CompanyName © 202X. All rights reserved.</p></footer>

<script>
    // 단계 애니메이션
    const steps = [
      { id:'s3', label:'이벤트 시나리오 배치 중...', delay:1200 },
      { id:'s4', label:'AI 경영 코치 준비 중...', delay:2400 },
      { id:'s5', label:'거의 다 됐어요!', delay:3400 },
    ];

    steps.forEach(({ id, label, delay }) => {
      setTimeout(() => {
        const prev = document.querySelector('.step-item.active');
        if (prev) { prev.classList.remove('active'); prev.classList.add('done'); }
        document.getElementById(id).classList.add('active');
        document.getElementById('progress-label').textContent = label;
      }, delay);
    });

    // 완료 후 대시보드 이동 (정적 데모라 4초 후 알림만)
    setTimeout(() => {
      const last = document.querySelector('.step-item.active');
      if (last) { last.classList.remove('active'); last.classList.add('done'); }
      document.getElementById('progress-label').textContent = '완료! 대시보드로 이동합니다.';
      // 실제 연동 시 아래 주석 해제
      // window.location.href = '/dashboard';
    }, 4800);
</script>
<script src="../common.js"></script>
<script>requireAuth(); updateNav();</script>
</body>
</html>
