<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>운영 리포트 – MEDSIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --blue: #1A6BFF; --blue-dark: #0F4FCC; --blue-bg: #EFF5FF;
            --navy: #0D1B2A;
            --gray-1: #F5F7FA; --gray-2: #E8ECF2; --gray-3: #C8D0DC;
            --gray-5: #7A8699; --gray-7: #3D4F63;
            --green: #22C97A; --orange: #FF8C42; --red: #FF3B3B;
            --purple: #8B5CF6;
            --font: 'Pretendard', -apple-system, sans-serif;
            --sb: 160px;
        }
        body { font-family: var(--font); color: var(--navy); background: var(--gray-1); min-height: 100vh; }
        .layout { display: flex; min-height: 100vh; }
        .content { margin-left: var(--sb); flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .page-body { flex: 1; padding: 28px 32px; }

        /* breadcrumb & title */
        .page-breadcrumb { font-size: 11px; color: var(--gray-5); margin-bottom: 6px; }
        .page-breadcrumb a { color: var(--gray-5); text-decoration: none; }
        .page-breadcrumb a:hover { color: var(--blue); }
        .page-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .page-title { font-size: 20px; font-weight: 800; }
        .btn-print { height: 34px; padding: 0 16px; background: white; border: 1px solid var(--gray-2); border-radius: 8px; font-size: 12px; font-weight: 700; font-family: var(--font); color: var(--navy); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: border-color .15s, color .15s; }
        .btn-print:hover { border-color: var(--blue); color: var(--blue); }

        /* KPI grid 5 */
        .kpi-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 20px; }
        .kpi-card { background: white; border: 1px solid var(--gray-2); border-radius: 12px; padding: 18px 20px; }
        .kpi-label { font-size: 11px; font-weight: 700; color: var(--gray-5); letter-spacing: .5px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .kpi-value { font-size: 19px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; }
        .kpi-sub { font-size: 11px; color: var(--gray-5); }
        .kpi-badge { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
        .kpi-badge.pos { background: rgba(34,201,122,.12); color: var(--green); }
        .kpi-badge.neg { background: rgba(255,59,59,.1); color: var(--red); }
        .kpi-badge.neu { background: var(--gray-2); color: var(--gray-5); }
        .demo-tag { font-size: 9px; font-weight: 600; color: var(--gray-5); background: var(--gray-2); padding: 1px 5px; border-radius: 3px; vertical-align: middle; }
        .profit-pos { color: var(--green); font-weight: 700; }
        .profit-neg { color: var(--red); font-weight: 700; }

        /* section cards */
        .section-card { background: white; border: 1px solid var(--gray-2); border-radius: 14px; padding: 22px 24px; margin-bottom: 18px; }
        .section-title { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section-title-sub { font-size: 11px; font-weight: 600; color: var(--gray-5); margin-left: auto; }

        /* charts */
        .chart-wrap { position: relative; height: 240px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
        .two-col > .section-card { margin-bottom: 0; }
        .donut-wrap { position: relative; height: 180px; }
        .cost-legend { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
        .cost-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .legend-name { flex: 1; color: var(--gray-7); }
        .legend-val { font-weight: 700; color: var(--navy); }
        .legend-pct { font-size: 11px; color: var(--gray-5); min-width: 36px; text-align: right; }

        /* ops table */
        .tbl-scroll { overflow-x: auto; }
        .ops-table { width: 100%; border-collapse: collapse; min-width: 640px; }
        .ops-table th { font-size: 11px; font-weight: 700; color: var(--gray-5); padding: 8px 12px; text-align: right; border-bottom: 2px solid var(--gray-2); background: var(--gray-1); white-space: nowrap; }
        .ops-table th:first-child { text-align: left; }
        .ops-table td { font-size: 12px; padding: 9px 12px; border-bottom: 1px solid var(--gray-2); text-align: right; white-space: nowrap; }
        .ops-table td:first-child { text-align: left; font-weight: 600; }
        .ops-table tr:hover td { background: var(--gray-1); }
        .ops-table tr.event-row td:first-child { border-left: 3px solid var(--orange); }

        /* event list */
        .event-list { display: flex; flex-direction: column; gap: 10px; }
        .event-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--gray-1); border-radius: 10px; border-left: 3px solid var(--gray-3); }
        .event-item.neg { border-color: var(--red); }
        .event-item.pos { border-color: var(--green); }
        .event-month { font-size: 11px; font-weight: 700; color: var(--gray-5); white-space: nowrap; flex-shrink: 0; min-width: 36px; }
        .event-content { flex: 1; }
        .event-name { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
        .event-desc { font-size: 11px; color: var(--gray-5); line-height: 1.5; }

        /* location table */
        .loc-table { width: 100%; border-collapse: collapse; }
        .loc-table td { padding: 10px 6px; border-bottom: 1px solid var(--gray-2); font-size: 13px; vertical-align: top; }
        .loc-table tr:last-child td { border-bottom: none; }
        .loc-label { font-weight: 600; color: var(--gray-5); width: 38%; }
        .loc-val { font-weight: 700; }
        .score-bar-bg { background: var(--gray-2); border-radius: 4px; height: 5px; margin-top: 5px; overflow: hidden; }
        .score-bar-fill { height: 5px; border-radius: 4px; }

        /* grade card */
        .grade-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0; gap: 10px; }
        .grade-circle { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; color: white; flex-shrink: 0; }
        .grade-label { font-size: 18px; font-weight: 800; }
        .grade-desc { font-size: 12px; color: var(--gray-5); text-align: center; max-width: 240px; line-height: 1.7; }
        .grade-breakdown { display: flex; gap: 20px; margin-top: 6px; border-top: 1px solid var(--gray-2); padding-top: 14px; width: 100%; justify-content: center; }
        .grade-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .grade-item-val { font-size: 15px; font-weight: 800; }
        .grade-item-lbl { font-size: 10px; color: var(--gray-5); }

        /* empty state */
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; color: var(--gray-5); }
        .empty-title { font-size: 18px; font-weight: 800; color: var(--navy); margin: 16px 0 8px; }
        .empty-desc { font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
        .empty-btn { display: inline-block; padding: 11px 24px; background: var(--blue); color: white; border-radius: 10px; font-size: 14px; font-weight: 700; text-decoration: none; }

        footer { background: var(--navy); padding: 14px 26px; text-align: center; }
        footer p { font-size: 12px; color: rgba(255,255,255,.4); }

        @media print {
            .content { margin-left: 0; }
            .section-card { break-inside: avoid; }
            footer { display: none; }
        }
    </style>
</head>
<body>
<div class="layout">
    <div id="sidebar-root"></div>
    <div class="content">
        <div class="page-body">

            <!-- empty state -->
            <div id="empty-state" class="empty-state" style="display:none">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--gray-3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <p class="empty-title">리포트를 생성할 데이터가 없습니다</p>
                <p class="empty-desc">시뮬레이션을 먼저 진행해 주세요.<br>1개월 이상 운영 데이터가 있어야 리포트를 볼 수 있습니다.</p>
                <a class="empty-btn" href="dashboard.html">← 병원 현황으로</a>
            </div>

            <!-- main content -->
            <div id="main-content" style="display:none">

                <!-- A: 헤더 -->
                <div class="page-breadcrumb">
                    <a href="dashboard.html">병원 현황</a> › 운영 리포트
                </div>
                <div class="page-title-row">
                    <h1 class="page-title" id="report-title">운영 리포트</h1>
                    <button class="btn-print" onclick="window.print()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 6 2 18 2 18 9"/>
                            <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
                            <rect x="6" y="14" width="12" height="8"/>
                        </svg>
                        인쇄
                    </button>
                </div>

                <!-- B: KPI 5개 -->
                <div class="kpi-grid-5" id="kpi-grid"></div>

                <!-- C-1: 성장 추이 라인차트 -->
                <div class="section-card">
                    <div class="section-title">
                        성장 추이
                        <span class="section-title-sub">단위: 만원</span>
                    </div>
                    <div class="chart-wrap"><canvas id="growth-chart"></canvas></div>
                </div>

                <!-- C-2: 환자 구성 도넛 + 재무 구조 도넛 -->
                <div class="two-col">
                    <div class="section-card">
                        <div class="section-title">환자 구성 <span class="section-title-sub">누적 합산</span></div>
                        <div class="donut-wrap"><canvas id="patient-donut"></canvas></div>
                        <div class="cost-legend" id="patient-legend"></div>
                    </div>
                    <div class="section-card">
                        <div class="section-title">
                            재무 구조
                            <span class="demo-tag">※ 최근 1개월 기준</span>
                        </div>
                        <div class="donut-wrap"><canvas id="finance-donut"></canvas></div>
                        <div class="cost-legend" id="finance-legend"></div>
                    </div>
                </div>

                <!-- D-1: 월별 운영 현황 -->
                <div class="section-card">
                    <div class="section-title">
                        월별 운영 현황
                        <span class="section-title-sub">
                            이벤트 발생월
                            <span style="display:inline-block;width:8px;height:8px;background:var(--orange);border-radius:2px;vertical-align:middle;margin-left:4px;"></span>
                        </span>
                    </div>
                    <div class="tbl-scroll">
                        <table class="ops-table">
                            <thead>
                                <tr>
                                    <th>월</th>
                                    <th>매출</th>
                                    <th>영업이익</th>
                                    <th>순이익</th>
                                    <th>현금잔고</th>
                                    <th>환자수</th>
                                    <th>평판</th>
                                </tr>
                            </thead>
                            <tbody id="ops-tbody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- D-2: 이벤트 이력 -->
                <div class="section-card" id="events-section" style="display:none">
                    <div class="section-title">이벤트 이력</div>
                    <div class="event-list" id="event-list"></div>
                </div>

                <!-- E: 입지 평가 + 종합 등급 -->
                <div class="two-col">
                    <div class="section-card">
                        <div class="section-title">
                            입지 평가
                            <span class="demo-tag">※ 데모 파생값</span>
                        </div>
                        <table class="loc-table" id="loc-table"></table>
                    </div>
                    <div class="section-card">
                        <div class="section-title">종합 평가</div>
                        <div class="grade-wrap" id="grade-wrap"></div>
                    </div>
                </div>

            </div>
        </div>
        <footer><p>MEDSIM © 2026. All rights reserved.</p></footer>
    </div>
</div>
<script src="common.js"></script>

<script>
(function () {

    // ── 포맷 헬퍼 ──────────────────────────────────────────────

    // 입력값: 만원 단위 (백엔드 revenue/netProfit/cumulativeCash 단위와 동일)
    function formatEok(manwon) {
        if (manwon === null || manwon === undefined) return '0만원';
        var abs = Math.abs(manwon), sign = manwon < 0 ? '-' : '';
        if (abs >= 10000) return sign + (abs / 10000).toFixed(1) + '억';
        return sign + abs.toLocaleString() + '만원';
    }

    function pctBadge(rate) {
        if (rate === null || rate === undefined) return '';
        var pct = (rate * 100).toFixed(1);
        var cls = rate >= 0 ? 'pos' : 'neg';
        var sign = rate >= 0 ? '+' : '';
        return '<span class="kpi-badge ' + cls + '">' + sign + pct + '%</span>';
    }

    function scoreBar(score, color) {
        var pct = Math.min(100, Math.max(0, Math.round(score)));
        return '<div class="score-bar-bg"><div class="score-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>';
    }

    // ── 종합 등급 산출 ──────────────────────────────────────────

    function computeGrade(all, config) {
        var last = all[all.length - 1];
        var score = 0;

        var bepMonth = null;
        for (var i = 0; i < all.length; i++) {
            if ((all[i].netProfit || 0) > 0) { bepMonth = all[i].month; break; }
        }

        // BEP 시점 (0–30점)
        if (bepMonth !== null) {
            if (bepMonth <= 6) score += 30;
            else if (bepMonth <= 12) score += 20;
            else if (bepMonth <= 18) score += 10;
            else score += 5;
        }

        // 평판 (0–25점)
        var rep = last.reputationScore || 0;
        if (rep >= 4.5) score += 25;
        else if (rep >= 4.0) score += 20;
        else if (rep >= 3.5) score += 15;
        else if (rep >= 3.0) score += 10;

        // 현금 건전성 (0–25점)
        var totalInvest = Math.max((config.ownedCash || 0) + (config.loanAmount || 0), 1);
        var cashRatio = (last.cumulativeCash || 0) / totalInvest;
        if (cashRatio >= 2.0) score += 25;
        else if (cashRatio >= 1.5) score += 20;
        else if (cashRatio >= 1.0) score += 15;
        else if (cashRatio >= 0.5) score += 10;
        else if (cashRatio > 0) score += 5;

        // 누적 수익성 (0–20점)
        var totalProfit = all.reduce(function (s, r) { return s + (r.netProfit || 0); }, 0);
        var profitRatio = totalProfit / totalInvest;
        if (profitRatio >= 2.0) score += 20;
        else if (profitRatio >= 1.0) score += 15;
        else if (profitRatio >= 0.5) score += 10;
        else if (profitRatio >= 0) score += 5;

        var g;
        if (score >= 85) g = { grade: 'S', label: '최우수', color: '#8B5CF6', desc: '개원 성과가 탁월합니다. 안정적 성장 궤도에 올랐으며 재정 건전성이 매우 높습니다.' };
        else if (score >= 70) g = { grade: 'A', label: '우수', color: '#22C97A', desc: '개원 목표를 충분히 달성하고 있습니다. 지속 성장을 위한 투자를 고려해보세요.' };
        else if (score >= 55) g = { grade: 'B', label: '양호', color: '#1A6BFF', desc: '전반적으로 안정적인 운영 중입니다. 일부 지표 개선으로 더 좋은 성과를 낼 수 있습니다.' };
        else if (score >= 40) g = { grade: 'C', label: '보통', color: '#FF8C42', desc: '운영에 개선이 필요합니다. 비용 구조와 환자 유치 전략을 재검토하세요.' };
        else g = { grade: 'F', label: '미흡', color: '#FF3B3B', desc: '재정 위기 상황입니다. 비용 절감과 수익 개선이 시급합니다.' };

        g.score = score;
        g.bepMonth = bepMonth;
        return g;
    }

    // ── 입지 점수 ──────────────────────────────────────────────

    function computeLocation(config) {
        var fg = config.floatingPopulation || 0;
        var cc = config.competitorCount !== null && config.competitorCount !== undefined ? config.competitorCount : 5;
        var sg = config.sigungu || '';

        var PREMIUM = ['강남구', '서초구', '송파구'];
        var LOW = ['노원구', '도봉구', '중랑구'];
        var areaScore = PREMIUM.indexOf(sg) >= 0 ? 90 : (LOW.indexOf(sg) >= 0 ? 55 : 72);
        var floatScore = Math.min(100, Math.round(fg / 500));
        var compScore = Math.max(0, 100 - cc * 10);
        var overall = Math.round((areaScore + floatScore + compScore) / 3);

        return { overall: overall, areaScore: areaScore, floatScore: floatScore, compScore: compScore };
    }

    // ── 메인 렌더 ──────────────────────────────────────────────

    function render() {
        var all = getAllMonthlyData();
        if (!all || all.length === 0) {
            document.getElementById('empty-state').style.display = '';
            return;
        }
        document.getElementById('main-content').style.display = '';

        var config = getConfig();
        var last = all[all.length - 1];
        var months = all.length;

        document.getElementById('report-title').textContent = months + '개월 운영 리포트';

        // ── B: KPI 5개 ──
        var totalRevenue = all.reduce(function (s, r) { return s + (r.revenue || 0); }, 0);
        var totalProfit  = all.reduce(function (s, r) { return s + (r.netProfit || 0); }, 0);
        var totalPat     = all.reduce(function (s, r) { return s + (r.patientsCount || 0); }, 0);
        var finalCash    = last.cumulativeCash || 0;
        var finalRep     = (last.reputationScore || 0).toFixed(1);

        document.getElementById('kpi-grid').innerHTML = [
            {
                label: '누적 총매출',
                value: formatEok(totalRevenue),
                sub: months + '개월 합산',
                badge: '',
            },
            {
                label: '누적 순이익',
                value: formatEok(totalProfit),
                sub: months + '개월 합산',
                badge: '',
                cls: totalProfit >= 0 ? 'profit-pos' : 'profit-neg',
            },
            {
                label: '현재 평판',
                value: '★ ' + finalRep,
                sub: '0–5점 척도',
                badge: pctBadge(last.reputationChangeRate),
            },
            {
                label: '현금 잔고',
                value: formatEok(finalCash),
                sub: months + '개월 말 기준',
                badge: pctBadge(last.cashChangeRate),
            },
            {
                label: '누적 환자수',
                value: totalPat.toLocaleString() + '명',
                sub: months + '개월 합산',
                badge: pctBadge(last.patientsChangeRate),
            },
        ].map(function (c) {
            return '<div class="kpi-card">' +
                '<div class="kpi-label">' + c.label + (c.badge ? c.badge : '') + '</div>' +
                '<div class="kpi-value' + (c.cls ? ' ' + c.cls : '') + '">' + c.value + '</div>' +
                '<div class="kpi-sub">' + c.sub + '</div>' +
                '</div>';
        }).join('');

        // ── C-1: 성장 추이 라인차트 ──
        var labels   = all.map(function (r) { return r.month + '월'; });
        // 백엔드 값이 이미 만원 단위 — 그대로 사용
        var revData  = all.map(function (r) { return r.revenue       || 0; });
        var profData = all.map(function (r) { return r.netProfit     || 0; });
        var cashData = all.map(function (r) { return r.cumulativeCash || 0; });

        console.log('[리포트]', { 누적매출: totalRevenue, 누적순이익: totalProfit, 현금: finalCash,
            샘플_매출라인: revData.slice(0, 3), 샘플_순이익라인: profData.slice(0, 3) });

        createLineChart('growth-chart', labels, [
            { label: '매출',    data: revData,  borderColor: '#1A6BFF', backgroundColor: 'rgba(26,107,255,.07)', fill: true,  tension: .35, pointRadius: 2, borderWidth: 2 },
            { label: '순이익',  data: profData, borderColor: '#22C97A', backgroundColor: 'transparent',           fill: false, tension: .35, pointRadius: 2, borderWidth: 2 },
            { label: '현금잔고', data: cashData, borderColor: '#FF8C42', backgroundColor: 'transparent',          fill: false, tension: .35, pointRadius: 2, borderWidth: 2, borderDash: [5, 3] },
        ], {
            scales: {
                y: {
                    beginAtZero: false,
                    ticks: {
                        callback: function (v) { return v.toLocaleString() + '만'; }
                    }
                }
            }
        });

        // ── C-2a: 환자 구성 도넛 ──
        var totalNew    = all.reduce(function (s, r) { return s + (r.newPatientCount    || 0); }, 0);
        var totalReturn = all.reduce(function (s, r) { return s + (r.returnPatientCount || 0); }, 0);
        var totalAllPat = totalNew + totalReturn || 1;
        var newPct = Math.round(totalNew    / totalAllPat * 100);
        var retPct = 100 - newPct;

        createDoughnutChart('patient-donut',
            ['신규 환자', '재진 환자'],
            [newPct, retPct],
            ['#1A6BFF', '#22C97A']
        );
        document.getElementById('patient-legend').innerHTML = [
            { name: '신규 환자', pct: newPct,  count: totalNew,    color: '#1A6BFF' },
            { name: '재진 환자', pct: retPct,  count: totalReturn, color: '#22C97A' },
        ].map(function (i) {
            return '<div class="cost-legend-item">' +
                '<div class="legend-dot" style="background:' + i.color + '"></div>' +
                '<span class="legend-name">' + i.name + '</span>' +
                '<span class="legend-val">' + i.count.toLocaleString() + '명</span>' +
                '<span class="legend-pct">' + i.pct + '%</span>' +
                '</div>';
        }).join('');

        // ── C-2b: 재무 구조 도넛 (최근 1개월) ──
        var finItems = [
            { name: '인건비',   val: (last.laborCost || 0) + (last.insuranceCost || 0), color: '#1A6BFF' },
            { name: '임대료',   val: last.rentCost        || 0,                          color: '#8B5CF6' },
            { name: '변동비',   val: last.variableCost    || 0,                          color: '#22C97A' },
            { name: '마케팅',   val: last.marketingCost   || 0,                          color: '#FF8C42' },
            { name: '감가상각', val: last.depreciationCost || 0,                         color: '#C8D0DC' },
            { name: '기타',     val: last.otherMgmtCost   || 0,                          color: '#7A8699' },
        ].filter(function (i) { return i.val > 0; });

        var finTotal = finItems.reduce(function (s, i) { return s + i.val; }, 0) || 1;
        var finPcts  = finItems.map(function (i) { return Math.round(i.val / finTotal * 100); });

        createDoughnutChart('finance-donut',
            finItems.map(function (i) { return i.name; }),
            finPcts,
            finItems.map(function (i) { return i.color; })
        );
        document.getElementById('finance-legend').innerHTML = finItems.map(function (item, idx) {
            return '<div class="cost-legend-item">' +
                '<div class="legend-dot" style="background:' + item.color + '"></div>' +
                '<span class="legend-name">' + item.name + '</span>' +
                '<span class="legend-val">' + formatEok(item.val) + '</span>' +
                '<span class="legend-pct">' + finPcts[idx] + '%</span>' +
                '</div>';
        }).join('');

        // ── D-1: 월별 운영 현황 테이블 ──
        var evMonthSet = {};
        all.forEach(function (r) {
            if (r.activeEvents && r.activeEvents.length > 0) evMonthSet[r.month] = true;
        });

        document.getElementById('ops-tbody').innerHTML = all.map(function (r) {
            var hasEv = evMonthSet[r.month];
            var opCls = (r.operatingProfit || 0) >= 0 ? 'profit-pos' : 'profit-neg';
            var npCls = (r.netProfit       || 0) >= 0 ? 'profit-pos' : 'profit-neg';
            return '<tr class="' + (hasEv ? 'event-row' : '') + '">' +
                '<td>' + r.month + '월' + (hasEv ? '&nbsp;<span style="display:inline-block;width:6px;height:6px;background:var(--orange);border-radius:50%;vertical-align:middle;"></span>' : '') + '</td>' +
                '<td>' + formatEok(r.revenue) + '</td>' +
                '<td class="' + opCls + '">' + formatEok(r.operatingProfit) + '</td>' +
                '<td class="' + npCls + '">' + formatEok(r.netProfit) + '</td>' +
                '<td>' + formatEok(r.cumulativeCash) + '</td>' +
                '<td>' + (r.patientsCount || 0).toLocaleString() + '명</td>' +
                '<td>' + (r.reputationScore !== null && r.reputationScore !== undefined ? r.reputationScore.toFixed(1) : '–') + '</td>' +
                '</tr>';
        }).join('');

        // ── D-2: 이벤트 이력 ──
        var allEvents = [];
        all.forEach(function (r) {
            if (r.activeEvents && r.activeEvents.length > 0) {
                r.activeEvents.forEach(function (ev) {
                    allEvents.push({ month: r.month, ev: ev });
                });
            }
        });

        if (allEvents.length > 0) {
            document.getElementById('events-section').style.display = '';
            document.getElementById('event-list').innerHTML = allEvents.map(function (item) {
                var ev = item.ev;
                var isNeg = ev.severity === 'HIGH' ||
                    (ev.impactMap && ((ev.impactMap.revenueMultiplier !== undefined && ev.impactMap.revenueMultiplier < 1) ||
                                     (ev.impactMap.extraCost !== undefined && ev.impactMap.extraCost > 0)));
                return '<div class="event-item ' + (isNeg ? 'neg' : 'pos') + '">' +
                    '<div class="event-month">' + item.month + '월</div>' +
                    '<div class="event-content">' +
                    '<div class="event-name">' + (ev.title || ev.type || '이벤트') + '</div>' +
                    '<div class="event-desc">' + (ev.description || '') + '</div>' +
                    '</div></div>';
            }).join('');
        }

        // ── E-1: 입지 평가 ──
        var loc = computeLocation(config);
        document.getElementById('loc-table').innerHTML = [
            { label: '지역',       val: config.sigungu || '미설정', score: null },
            { label: '지역 입지',  val: loc.areaScore  + '점',      score: loc.areaScore,  color: '#1A6BFF' },
            { label: '유동 인구',  val: (config.floatingPopulation || 0).toLocaleString() + '명', score: loc.floatScore, color: '#22C97A' },
            { label: '경쟁 강도',  val: (config.competitorCount !== null && config.competitorCount !== undefined ? config.competitorCount : '–') + '개 병원', score: loc.compScore, color: '#FF8C42' },
            { label: '종합 입지',  val: loc.overall    + '점 / 100', score: loc.overall,   color: '#8B5CF6' },
        ].map(function (row) {
            return '<tr>' +
                '<td class="loc-label">' + row.label + '</td>' +
                '<td class="loc-val">' + row.val + (row.score !== null ? scoreBar(row.score, row.color) : '') + '</td>' +
                '</tr>';
        }).join('');

        // ── E-2: 종합 등급 ──
        var grade = computeGrade(all, config);
        var totalProfitM = Math.round(totalProfit / 10000);
        var profSign = totalProfitM >= 0 ? '+' : '';
        var profColor = totalProfitM >= 0 ? 'var(--green)' : 'var(--red)';

        document.getElementById('grade-wrap').innerHTML =
            '<div class="grade-circle" style="background:' + grade.color + '">' + grade.grade + '</div>' +
            '<div class="grade-label" style="color:' + grade.color + '">' + grade.label + '</div>' +
            '<div class="grade-desc">' + grade.desc + '</div>' +
            '<div class="grade-breakdown">' +
                '<div class="grade-item">' +
                    '<div class="grade-item-val">' + (grade.bepMonth !== null ? grade.bepMonth + '개월' : '미달성') + '</div>' +
                    '<div class="grade-item-lbl">BEP 시점</div>' +
                '</div>' +
                '<div class="grade-item">' +
                    '<div class="grade-item-val" style="color:' + profColor + '">' + profSign + totalProfitM.toLocaleString() + '만</div>' +
                    '<div class="grade-item-lbl">누적 순이익</div>' +
                '</div>' +
                '<div class="grade-item">' +
                    '<div class="grade-item-val">' + grade.score + '점</div>' +
                    '<div class="grade-item-lbl">종합 점수</div>' +
                '</div>' +
            '</div>';
    }

    renderSidebar('report');
    render();

})();
</script>
</body>
</html>
