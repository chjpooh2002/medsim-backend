<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>시작하기 – MEDSIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --blue: #1A6BFF; --blue-dark: #0F4FCC; --navy: #0D1B2A;
          --gray-1: #F5F7FA; --gray-2: #E8ECF2; --gray-3: #C8D0DC;
          --gray-5: #7A8699; --gray-7: #3D4F63; --white: #FFFFFF;
          --font: 'Pretendard', -apple-system, sans-serif;
        }
        html, body { height: 100%; }
        body { font-family: var(--font); color: var(--navy); background: var(--gray-1); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }

        /* NAV */
        nav { background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--gray-2); height: 60px; display: flex; align-items: center; padding: 0 32px; flex-shrink: 0; }
        .nav-inner { width: 100%; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
        .nav-left { display: flex; gap: 28px; }
        .nav-left a { font-size: 13px; font-weight: 500; color: var(--gray-7); text-decoration: none; }
        .nav-left a:hover { color: var(--blue); }
        .nav-logo { display: flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; }
        .logo-icon { width: 28px; height: 28px; background: var(--blue); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 16px; height: 16px; fill: white; }
        .logo-type { font-size: 17px; font-weight: 800; color: var(--navy); letter-spacing: .5px; }
        .nav-right { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
        .btn-outline { padding: 7px 16px; border: 1.5px solid var(--gray-3); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--navy); background: transparent; text-decoration: none; transition: border-color .18s; display: inline-block; }
        .btn-outline:hover { border-color: var(--blue); color: var(--blue); }
        .btn-solid { padding: 7px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; color: white; background: var(--blue); text-decoration: none; display: inline-block; transition: background .18s; }
        .btn-solid:hover { background: var(--blue-dark); }

        /* MAIN */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 32px; }
        .intro-card {
          background: white; border-radius: 20px; border: 1px solid var(--gray-2);
          max-width: 860px; width: 100%; padding: 64px;
          display: grid; grid-template-columns: 280px 1fr; gap: 60px; align-items: center;
          box-shadow: 0 4px 24px rgba(13,27,42,.07);
          animation: fadeUp .5s ease both;
        }
        .blob-wrap { display: flex; align-items: center; justify-content: center; }
        .blob {
          width: 220px; height: 220px;
          background: var(--gray-2);
          border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%;
          animation: morph 6s ease-in-out infinite;
        }
        @keyframes morph {
          0%,100% { border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%; }
          33%      { border-radius: 40% 60% 45% 55% / 60% 40% 55% 45%; }
          66%      { border-radius: 55% 45% 60% 40% / 45% 55% 50% 50%; }
        }
        .intro-content { display: flex; flex-direction: column; gap: 20px; }
        .intro-badge { font-size: 13px; font-weight: 700; color: var(--blue); letter-spacing: .5px; }
        .intro-content h1 { font-size: 32px; font-weight: 800; line-height: 1.3; letter-spacing: -1px; }
        .intro-content p { font-size: 15px; line-height: 1.75; color: var(--gray-5); }
        .intro-star { font-size: 13px; color: var(--gray-5); display: flex; align-items: center; gap: 6px; }
        .intro-star::before { content: '★★★★★'; color: #FFC107; font-size: 14px; letter-spacing: 2px; }
        .start-btn {
          display: inline-flex; align-items: center; gap: 8px;
          padding: 14px 32px; background: var(--blue); color: white;
          font-size: 15px; font-weight: 700; font-family: var(--font);
          border: none; border-radius: 10px; cursor: pointer;
          text-decoration: none; width: fit-content;
          transition: background .18s, transform .15s;
        }
        .start-btn:hover { background: var(--blue-dark); transform: translateY(-1px); }
        .start-btn svg { width: 16px; height: 16px; fill: white; }

        footer { background: var(--navy); padding: 20px 32px; text-align: center; }
        footer p { font-size: 12px; color: rgba(255,255,255,.4); }

        @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>
<nav>
    <div class="nav-inner">
        <div class="nav-left"><a href="../index.html">HOME</a><a href="#">ABOUT</a><a href="#">SERVICE</a></div>
        <a class="nav-logo" href="../index.html">
            <div class="logo-icon"><svg viewBox="0 0 20 20"><rect x="3" y="9" width="14" height="2" rx="1"/><rect x="9" y="3" width="2" height="14" rx="1"/></svg></div>
            <span class="logo-type">MEDSIM</span>
        </a>
        <div class="nav-right">
            <a class="btn-outline" href="../signup.html">회원가입</a>
            <a class="btn-solid"   href="../login.html">로그인</a>
        </div>
    </div>
</nav>

<main>
    <div class="intro-card">
        <div class="blob-wrap"><div class="blob"></div></div>
        <div class="intro-content">
            <p class="intro-badge">MEDSIM</p>
            <h1>당신의 병원을<br>시작할 시간입니다.</h1>
            <p>개원 이후 36개월 동안<br>당신은 수많은 의사결정을 내리게됩니다.</p>
            <p class="intro-star">받습니다</p>
            <a class="start-btn" href="start2.html">
                시작하기
                <svg viewBox="0 0 20 20"><path d="M7 4l8 6-8 6V4z"/></svg>
            </a>
        </div>
    </div>
</main>

<footer><p>MEDSIM © 2026. All rights reserved.</p></footer>
<script src="../common.js"></script>
<script>requireAuth(); updateNav();</script>
</body>
</html>
