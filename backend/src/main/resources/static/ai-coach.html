<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI 코치 – MEDSIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        :root { --blue:#1A6BFF; --blue-dark:#0F4FCC; --blue-bg:#EFF5FF; --navy:#0D1B2A; --gray-1:#F5F7FA; --gray-2:#E8ECF2; --gray-3:#C8D0DC; --gray-5:#7A8699; --gray-7:#3D4F63; --font:'Pretendard',-apple-system,sans-serif; --sb:160px; }
        body { font-family:var(--font); color:var(--navy); background:var(--gray-1); min-height:100vh; }
        .layout { display:flex; min-height:100vh; }
        .sidebar { width:var(--sb); flex-shrink:0; position:fixed; top:0; left:0; height:100vh; background:white; border-right:1px solid var(--gray-2); display:flex; flex-direction:column; overflow-y:auto; z-index:40; }
        .sb-logo { padding:17px 14px 13px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--gray-2); flex-shrink:0; }
        .sb-logo-icon { width:22px; height:22px; background:var(--blue); border-radius:5px; display:flex; align-items:center; justify-content:center; }
        .sb-logo-icon svg { width:12px; height:12px; fill:white; }
        .sb-logo-type { font-size:14px; font-weight:800; color:var(--navy); }
        .sb-icons { display:flex; gap:4px; padding:10px 12px; border-bottom:1px solid var(--gray-2); }
        .sb-icon-btn { flex:1; height:28px; border:1px solid var(--gray-2); border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:white; color:#7A8699; }
        .sb-icon-btn svg { width:12px; height:12px; }
        .sb-search { padding:9px 12px; border-bottom:1px solid var(--gray-2); }
        .sb-search-wrap { display:flex; align-items:center; gap:5px; background:var(--gray-1); border-radius:6px; padding:5px 9px; border:1px solid var(--gray-2); }
        .sb-search-wrap svg { width:11px; height:11px; color:#C8D0DC; flex-shrink:0; }
        .sb-search-wrap input { border:none; background:transparent; font-size:11px; font-family:var(--font); width:100%; outline:none; }
        .sb-nav { flex:1; padding:6px 0; }
        .sb-menu-item { display:flex; align-items:center; gap:8px; padding:8px 14px; font-size:12px; font-weight:500; color:#7A8699; text-decoration:none; white-space:nowrap; }
        .sb-menu-item:hover { background:var(--gray-1); color:var(--navy); }
        .sb-menu-item.active { background:var(--blue-bg); color:var(--blue); font-weight:700; }
        .sb-menu-item svg { width:14px; height:14px; flex-shrink:0; }
        .sb-bottom { padding:12px 14px; border-top:1px solid var(--gray-2); }
        .sb-month-badge { background:var(--blue-bg); border-radius:8px; padding:8px 10px; text-align:center; }
        .sb-month-num { font-size:16px; font-weight:800; color:var(--blue); }
        .sb-month-lbl { font-size:10px; color:var(--blue); opacity:.7; margin-top:1px; }
        .content { margin-left:var(--sb); flex:1; min-width:0; display:flex; flex-direction:column; }
        .content-inner { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; text-align:center; color:#7A8699; }
        .placeholder-icon { margin-bottom:20px; }
        .placeholder-title { font-size:20px; font-weight:800; color:#0D1B2A; margin-bottom:8px; }
        .placeholder-desc { font-size:14px; line-height:1.7; margin-bottom:24px; }
        .placeholder-back { display:inline-block; padding:11px 24px; background:var(--blue); color:white; border-radius:10px; font-size:14px; font-weight:700; text-decoration:none; }
        footer { background:#0D1B2A; padding:14px 26px; text-align:center; }
        footer p { font-size:12px; color:rgba(255,255,255,.4); }
    </style>
</head>
<body>
<div class="layout">
    <div id="sidebar-root"></div>
    <div class="content">
        <div class="content-inner">
            <div class="placeholder-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--gray-3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <rect x="9" y="9" width="6" height="6"/>
                    <line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/>
                    <line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/>
                    <line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/>
                    <line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>
                </svg>
            </div>
            <p class="placeholder-title">AI 코치</p>
            <p class="placeholder-desc">이 기능은 준비 중입니다.<br>더 나은 서비스로 곧 찾아뵙겠습니다.</p>
            <a class="placeholder-back" href="dashboard.html">← 병원 현황으로</a>
        </div>
        <footer><p>MEDSIM © 2026. All rights reserved.</p></footer>
    </div>
</div>
<script src="common.js"></script>
<script>requireAuth(); renderSidebar('ai-coach');</script>
</body>
</html>
