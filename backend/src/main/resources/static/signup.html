<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 – MEDSIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --blue:      #1A6BFF;
          --blue-dark: #0F4FCC;
          --navy:      #0D1B2A;
          --gray-1:    #F5F7FA;
          --gray-2:    #E8ECF2;
          --gray-3:    #C8D0DC;
          --gray-5:    #7A8699;
          --white:     #FFFFFF;
          --font:      'Pretendard', -apple-system, sans-serif;
        }
        html, body { height: 100%; }
        body { font-family: var(--font); color: var(--navy); -webkit-font-smoothing: antialiased; display: flex; }

        .panel-left {
          flex: 1; background: #D0D9E3;
          display: flex; align-items: center; justify-content: center;
          position: relative; min-height: 100vh; overflow: hidden;
        }
        .placeholder-img {
          width: 55%; aspect-ratio: 1;
          border: 3px solid rgba(255,255,255,.6); border-radius: 4px; position: relative;
        }
        .placeholder-img::before, .placeholder-img::after {
          content: ''; position: absolute;
          background: rgba(255,255,255,.6); height: 3px;
          width: 142%; top: calc(50% - 1.5px); left: -21%;
        }
        .placeholder-img::before { transform: rotate(45deg); }
        .placeholder-img::after  { transform: rotate(-45deg); }

        .left-logo {
          position: absolute; top: 28px; left: 32px;
          display: flex; align-items: center; gap: 7px; text-decoration: none;
        }
        .logo-icon { width: 28px; height: 28px; background: var(--blue); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 16px; height: 16px; fill: white; }
        .logo-type { font-size: 17px; font-weight: 800; color: white; letter-spacing: .5px; }

        .panel-right {
          width: 480px; min-height: 100vh; background: white;
          display: flex; flex-direction: column; justify-content: center;
          padding: 60px 56px;
        }
        .auth-title { font-size: 28px; font-weight: 800; margin-bottom: 28px; letter-spacing: -.5px; }

        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
        .field input {
          width: 100%; padding: 11px 14px;
          border: 1.5px solid var(--gray-2); border-radius: 9px;
          font-size: 14px; font-family: var(--font); color: var(--navy);
          background: var(--gray-1); outline: none;
          transition: border-color .18s, background .18s;
        }
        .field input:focus { border-color: var(--blue); background: white; }
        .field input::placeholder { color: var(--gray-3); }

        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 42px; }
        .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--gray-5); border: none; background: none; padding: 4px; }
        .pw-toggle svg { width: 18px; height: 18px; display: block; }

        .terms-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 22px; }
        .terms-row input { accent-color: var(--blue); width: 14px; height: 14px; margin-top: 2px; flex-shrink: 0; cursor: pointer; }
        .terms-row span { font-size: 13px; color: var(--gray-5); line-height: 1.5; }
        .terms-row a { color: var(--blue); text-decoration: none; }
        .terms-row a:hover { text-decoration: underline; }

        .submit-btn {
          width: 100%; padding: 13px; background: var(--blue); color: white;
          font-size: 15px; font-weight: 700; font-family: var(--font);
          border: none; border-radius: 10px; cursor: pointer;
          transition: background .18s, transform .15s; margin-bottom: 16px;
        }
        .submit-btn:hover { background: var(--blue-dark); transform: translateY(-1px); }

        .social-row { display: flex; gap: 10px; margin-bottom: 28px; }
        .social-btn {
          flex: 1; padding: 11px 8px; border: 1.5px solid var(--gray-2); border-radius: 9px;
          background: white; cursor: pointer; font-size: 13px; font-weight: 600; font-family: var(--font);
          color: var(--navy); display: flex; align-items: center; justify-content: center; gap: 8px;
          text-decoration: none; transition: border-color .18s, box-shadow .18s;
        }
        .social-btn:hover { border-color: var(--gray-3); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .social-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

        .auth-footer { text-align: center; font-size: 13.5px; color: var(--gray-5); }
        .auth-footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }

        @media (max-width: 820px) {
          .panel-left { display: none; }
          .panel-right { width: 100%; padding: 40px 28px; }
        }
    </style>
</head>
<body>

<div class="panel-left">
    <a class="left-logo" href="index.html">
        <div class="logo-icon"><svg viewBox="0 0 20 20"><rect x="3" y="9" width="14" height="2" rx="1"/><rect x="9" y="3" width="2" height="14" rx="1"/></svg></div>
        <span class="logo-type">MEDSIM</span>
    </a>
    <div class="placeholder-img"></div>
</div>

<div class="panel-right">
    <h1 class="auth-title">Sign Up</h1>

    <div class="row-2">
        <div class="field" style="margin-bottom:0">
            <label>First Name</label>
            <input type="text" placeholder="Placeholder" autocomplete="given-name" />
        </div>
        <div class="field" style="margin-bottom:0">
            <label>Last Name</label>
            <input type="text" placeholder="Placeholder" autocomplete="family-name" />
        </div>
    </div>

    <div class="field">
        <label>Email</label>
        <input type="email" placeholder="Placeholder" autocomplete="email" />
    </div>

    <div class="field">
        <label>Password</label>
        <div class="pw-wrap">
            <input type="password" id="pw-signup" placeholder="Placeholder" autocomplete="new-password" />
            <button class="pw-toggle" type="button" onclick="togglePw('pw-signup')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
    </div>

    <div class="terms-row">
        <input type="checkbox" id="terms" />
        <span>서비스 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의합니다.</span>
    </div>

    <button class="submit-btn">Sign Up</button>

    <div class="social-row">
        <a class="social-btn" href="#">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Log in with Google
        </a>
        <a class="social-btn" href="#">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            Log in with Apple
        </a>
    </div>

    <p class="auth-footer">Already have an account? <a href="login.html">Log In</a></p>
</div>

<script>
    function togglePw(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }
</script>
<script>
    document.querySelector('.submit-btn').addEventListener('click', async function() {
      // 입력값 수집
      const firstName = document.querySelectorAll('input[type=text]')[0].value.trim();
      const lastName  = document.querySelectorAll('input[type=text]')[1].value.trim();
      const email     = document.querySelector('input[type=email]').value.trim();
      const password  = document.getElementById('pw-signup').value.trim();

      // 간단 유효성 검사
      if (!firstName || !email || !password) {
        alert('이름, 이메일, 비밀번호를 입력해주세요.');
        return;
      }

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: firstName + ' ' + lastName,
            email: email,
            password: password
          })
        });

        if (res.ok) {
          alert('회원가입 완료! 로그인 페이지로 이동합니다.');
          window.location.href = '/login.html';
        } else {
          const err = await res.json();
          alert('오류: ' + (err.message || '회원가입에 실패했습니다.'));
        }
      } catch (e) {
        alert('서버 연결에 실패했습니다.');
      }
    });
</script>
</body>
</html>
