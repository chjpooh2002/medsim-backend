<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>시뮬레이션 대시보드 – MEDSIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=f26eb17ba8fd4ab4399206b4665037ca&libraries=services"></script>
    <style>
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        :root {
          --blue:#1A6BFF; --blue-dark:#0F4FCC; --blue-bg:#EFF5FF;
          --navy:#0D1B2A; --gray-1:#F5F7FA; --gray-2:#E8ECF2;
          --gray-3:#C8D0DC; --gray-5:#7A8699; --gray-7:#3D4F63;
          --green:#22C97A; --orange:#FF8C42; --red:#FF3B3B;
          --font:'Pretendard',-apple-system,sans-serif;
          --sb:160px;
        }
        body { font-family:var(--font); color:var(--navy); background:var(--gray-1); -webkit-font-smoothing:antialiased; min-height:100vh; }

        /* ── LAYOUT ── */
        .layout { display:flex; min-height:100vh; }

        /* ── SIDEBAR ── */
        .sidebar { width:var(--sb); flex-shrink:0; position:fixed; top:0; left:0; height:100vh; background:white; border-right:1px solid var(--gray-2); display:flex; flex-direction:column; overflow-y:auto; z-index:40; }

        .sb-logo { padding:17px 14px 13px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--gray-2); flex-shrink:0; }
        .sb-logo-icon { width:22px; height:22px; background:var(--blue); border-radius:5px; display:flex; align-items:center; justify-content:center; }
        .sb-logo-icon svg { width:12px; height:12px; fill:white; }
        .sb-logo-type { font-size:14px; font-weight:800; color:var(--navy); }

        .sb-icons { display:flex; gap:4px; padding:10px 12px; border-bottom:1px solid var(--gray-2); flex-shrink:0; }
        .sb-icon-btn { flex:1; height:28px; border:1px solid var(--gray-2); border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:white; color:var(--gray-5); transition:background .15s,color .15s; }
        .sb-icon-btn:hover { background:var(--gray-1); color:var(--blue); }
        .sb-icon-btn svg { width:12px; height:12px; }

        .sb-search { padding:9px 12px; border-bottom:1px solid var(--gray-2); flex-shrink:0; }
        .sb-search-wrap { display:flex; align-items:center; gap:5px; background:var(--gray-1); border-radius:6px; padding:5px 9px; border:1px solid var(--gray-2); }
        .sb-search-wrap svg { width:11px; height:11px; flex-shrink:0; color:var(--gray-3); }
        .sb-search-wrap input { border:none; background:transparent; font-size:11px; color:var(--navy); font-family:var(--font); width:100%; outline:none; }
        .sb-search-wrap input::placeholder { color:var(--gray-3); }

        .sb-nav { flex:1; padding:6px 0; overflow-y:auto; }
        .sb-menu-item { display:flex; align-items:center; gap:8px; padding:8px 14px; font-size:12px; font-weight:500; color:var(--gray-5); cursor:pointer; text-decoration:none; transition:background .13s,color .13s; white-space:nowrap; }
        .sb-menu-item:hover { background:var(--gray-1); color:var(--navy); }
        .sb-menu-item.active { background:var(--blue-bg); color:var(--blue); font-weight:700; }
        .sb-menu-item svg { width:14px; height:14px; flex-shrink:0; }

        .sb-bottom { padding:12px 14px; border-top:1px solid var(--gray-2); flex-shrink:0; }
        .sb-month-badge { background:var(--blue-bg); border-radius:8px; padding:8px 10px; text-align:center; }
        .sb-month-num { font-size:16px; font-weight:800; color:var(--blue); }
        .sb-month-lbl { font-size:10px; color:var(--blue); opacity:.7; margin-top:1px; }

        /* ── CONTENT ── */
        .content { margin-left:var(--sb); flex:1; min-width:0; display:flex; flex-direction:column; }
        .content-inner { flex:1; padding:22px 26px 56px; }

        /* ── TABS ── */
        .dash-tabs { display:flex; align-items:center; justify-content:space-between; background:white; border:1px solid var(--gray-2); border-radius:12px; padding:6px 8px; margin-bottom:18px; }
        .tab-list { display:flex; gap:2px; }
        .tab-item { padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; color:var(--gray-5); cursor:pointer; user-select:none; transition:background .15s,color .15s; display:flex; align-items:center; gap:6px; }
        .tab-item.active { background:var(--blue-bg); color:var(--blue); }
        .tab-item:hover:not(.active) { background:var(--gray-1); color:var(--navy); }
        .tab-badge { background:var(--red); color:white; font-size:10px; font-weight:700; padding:1px 6px; border-radius:10px; min-width:18px; text-align:center; line-height:1.6; }
        .tab-badge.blue { background:var(--blue); }
        .date-filter { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:500; color:var(--gray-7); cursor:pointer; padding:7px 14px; border:1px solid var(--gray-2); border-radius:8px; transition:border-color .15s,color .15s; }
        .date-filter:hover { border-color:var(--blue); color:var(--blue); }
        .date-filter svg { width:14px; height:14px; flex-shrink:0; }

        .tab-panel { display:none; }
        .tab-panel.active { display:block; }

        /* ── KPI ── */
        .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
        .kpi-card { background:white; border:1px solid var(--gray-2); border-radius:12px; padding:18px 20px; }
        .kpi-label { font-size:11px; font-weight:700; color:var(--gray-5); letter-spacing:.5px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
        .kpi-main { font-size:22px; font-weight:800; color:var(--navy); line-height:1.2; margin-bottom:5px; }
        .kpi-sub { font-size:12px; color:var(--gray-5); }
        .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; }
        .badge.pos { background:var(--blue-bg); color:var(--blue); }
        .badge.neg { background:#FFF0F0; color:var(--red); }

        /* ── GRIDS ── */
        .middle-grid { display:grid; grid-template-columns:1fr 220px 210px; gap:14px; margin-bottom:14px; }
        .bottom-grid { display:grid; grid-template-columns:1fr 320px; gap:14px; }

        /* ── CARD ── */
        .card { background:white; border:1px solid var(--gray-2); border-radius:12px; padding:18px 20px; }
        .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
        .card-title { font-size:13px; font-weight:700; color:var(--navy); }
        .card-sub { font-size:11px; color:var(--gray-5); font-weight:500; }

        /* ── GROWTH CHART ── */
        .chart-wrap { position:relative; height:220px; width:100%; overflow:hidden; }
        .chart-tip { display:none; position:absolute; top:14px; right:10px; background:white; border:1px solid var(--gray-2); border-radius:10px; padding:12px 14px; width:210px; box-shadow:0 6px 20px rgba(0,0,0,.10); z-index:10; }
        .chart-tip p { font-size:12px; color:var(--gray-7); line-height:1.65; margin-bottom:10px; }
        .chart-tip-btns { display:flex; gap:7px; justify-content:flex-end; }
        .tip-btn-no  { padding:5px 12px; border:1px solid var(--gray-3); border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; background:white; color:var(--gray-7); font-family:var(--font); }
        .tip-btn-yes { padding:5px 12px; border:none; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; background:var(--blue); color:white; font-family:var(--font); }

        /* ── PATIENT DONUT ── */
        .donut-wrap { position:relative; height:130px; display:flex; align-items:center; justify-content:center; }
        .donut-center { position:absolute; text-align:center; pointer-events:none; }
        .donut-pct { font-size:20px; font-weight:800; color:var(--navy); line-height:1; }
        .donut-lbl { font-size:10px; color:var(--gray-5); margin-top:3px; }
        .donut-legend { display:flex; flex-direction:column; gap:7px; margin-top:10px; }
        .legend-row { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--navy); }
        .legend-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
        .legend-name { flex:1; }
        .legend-pct { font-weight:700; }

        /* ── AI LIST ── */
        .ai-list { display:flex; flex-direction:column; gap:8px; }
        .ai-item { display:flex; align-items:center; gap:9px; padding:9px 11px; background:var(--gray-1); border-radius:9px; font-size:13px; font-weight:500; color:var(--navy); cursor:pointer; transition:background .15s,color .15s; border:1px solid transparent; }
        .ai-item:hover { background:var(--blue-bg); color:var(--blue); border-color:rgba(26,107,255,.15); }
        .ai-dot { width:6px; height:6px; border-radius:50%; background:var(--blue); flex-shrink:0; }

        /* ── EVENT TABLE ── */
        .event-table { width:100%; border-collapse:collapse; }
        .event-table th { font-size:11px; font-weight:700; color:var(--gray-5); padding:0 10px 10px; text-align:left; border-bottom:1.5px solid var(--gray-2); }
        .event-table td { font-size:13px; padding:9px 10px; border-bottom:1px solid var(--gray-2); vertical-align:middle; }
        .event-table tr:last-child td { border-bottom:none; }
        .event-name { font-weight:500; color:var(--navy); }
        .event-val { color:var(--gray-7); font-size:12px; }
        .event-change { text-align:right; }
        .event-empty { text-align:center; color:var(--gray-5); font-size:13px; padding:36px 0; line-height:1.8; }

        /* ── EXP CHART ── */
        .exp-donut-wrap { position:relative; height:140px; display:flex; align-items:center; justify-content:center; }
        .exp-legend { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
        .exp-row { display:flex; align-items:center; gap:9px; }
        .exp-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
        .exp-name { font-size:13px; color:var(--navy); flex:1; }
        .exp-amt { font-size:13px; font-weight:700; color:var(--navy); }

        /* ── STRATEGY CARDS ── */
        .strategy-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
        .strategy-card { background:white; border:1px solid var(--gray-2); border-radius:12px; padding:20px; }
        .strategy-card-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
        .strategy-icon { width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .strategy-title { font-size:14px; font-weight:700; color:var(--navy); }
        .strategy-rows { display:flex; flex-direction:column; gap:7px; margin-bottom:12px; }
        .strategy-row { display:flex; align-items:center; justify-content:space-between; font-size:12px; }
        .sr-label { color:var(--gray-5); }
        .sr-value { font-weight:600; color:var(--navy); }
        .strategy-hint { font-size:12px; color:var(--gray-7); background:var(--gray-1); border-radius:7px; padding:8px 10px; line-height:1.65; }

        .advance-bar { display:flex; align-items:center; justify-content:space-between; padding:16px 0 0; border-top:1px solid var(--gray-2); }
        .advance-info { font-size:13px; color:var(--gray-5); }
        .advance-info strong { color:var(--navy); font-weight:700; }
        .advance-btn { padding:11px 28px; background:var(--blue); color:white; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font); transition:background .15s; }
        .advance-btn:hover { background:var(--blue-dark); }
        .advance-btn:disabled { background:var(--gray-3); cursor:not-allowed; }

        /* ── INTERACTIVE STRATEGY TAB ── */
        .strat-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px; }
        .strat-title  { font-size:28px; font-weight:700; color:#111; margin:0 0 6px; line-height:1.2; }
        .strat-sub    { font-size:13px; color:#888; margin:0; }
        .strat-header-btns { display:flex; gap:10px; flex-shrink:0; margin-top:6px; }
        .strat-reset-btn   { padding:9px 18px; background:white; border:1px solid #ddd; color:#555; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font); transition:border-color .15s,color .15s; }
        .strat-reset-btn:hover { border-color:#1a73e8; color:#1a73e8; }
        .strat-advance-btn { padding:9px 22px; background:#1a73e8; color:white; border:none; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; font-family:var(--font); transition:background .15s; }
        .strat-advance-btn:hover { background:#1558b0; }
        .strat-advance-btn:disabled { background:#ccc; cursor:not-allowed; }

        .strat-section-hd { font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:0.8px; margin:0 0 12px; }

        .strat-kpi-row  { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
        .strat-kpi-card { background:white; border:1px solid #e0e0e0; border-radius:12px; padding:16px 20px; }
        .strat-kpi-label { font-size:12px; color:#888; font-weight:500; margin-bottom:6px; }
        .strat-kpi-value { font-size:18px; font-weight:700; color:#111; margin-bottom:4px; }
        .strat-kpi-foot  { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11px; color:#888; }

        .strat-cards-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px; }
        .strat-card       { background:white; border:1px solid #e0e0e0; border-radius:12px; padding:20px; }
        .strat-card-title { font-size:14px; font-weight:600; color:#111; margin:0 0 14px; }

        /* 인라인 라디오 */
        .ir-group { display:flex; gap:16px; flex-wrap:nowrap; }
        .ir-item  { display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap; user-select:none; }
        .ir-dot   { width:14px; height:14px; border-radius:50%; border:2px solid #ccc; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:border-color .15s; }
        .ir-dot.on   { border-color:#1a73e8; }
        .ir-dot-in   { width:6px; height:6px; border-radius:50%; background:#1a73e8; }
        .ir-label    { font-size:13px; color:#666; transition:color .15s; }
        .ir-item.on .ir-label { color:#1a73e8; font-weight:600; }

        /* 직원 스테퍼 */
        .staff-steppers { display:flex; flex-direction:column; gap:9px; margin:14px 0; }
        .staff-row  { display:flex; align-items:center; justify-content:space-between; }
        .staff-name { font-size:13px; color:#333; }
        .stepper    { display:flex; align-items:center; gap:10px; }
        .step-btn   { width:22px; height:22px; border-radius:50%; border:1.5px solid #ccc; background:white; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; color:#666; line-height:1; font-family:var(--font); transition:border-color .15s,color .15s; padding:0; }
        .step-btn:hover { border-color:#1a73e8; color:#1a73e8; }
        .step-count { font-size:14px; font-weight:700; color:#111; min-width:28px; text-align:center; }

        /* 예상 변화 영역 */
        .impact-sec  { border-top:1px solid #f0f0f0; padding-top:12px; margin-top:12px; }
        .impact-lbl  { font-size:11px; color:#888; margin-bottom:8px; }
        .impact-row  { display:flex; flex-wrap:wrap; gap:6px; }
        .ibadge      { border-radius:12px; padding:2px 8px; font-size:12px; font-weight:600; }
        .ibadge.pos  { background:#E8F0FE; color:#1a73e8; }
        .ibadge.neg  { background:#FDE8E8; color:#d93025; }
        .ibadge.sm   { font-size:11px; padding:1px 6px; }

        /* 섹션 서브 헤더 */
        .card-sub-hd { font-size:11px; color:#888; margin-bottom:7px; font-weight:600; }
        .card-sub-hd.mt { margin-top:12px; }

        /* 체크박스 */
        .cb-grid    { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; }
        .cb-item    { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
        .cb-single  { display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:10px; user-select:none; }
        .cb-single:last-child { margin-bottom:0; }
        .cb-box     { width:16px; height:16px; border:1.5px solid #ccc; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:border-color .15s,background .15s; }
        .cb-box.on  { border-color:#1a73e8; background:#1a73e8; }
        .cb-label   { font-size:13px; color:#333; }

        /* 마케팅 슬라이더 */
        .mkt-info  { font-size:13px; font-weight:600; color:#111; margin-bottom:3px; }
        .mkt-sub   { font-size:12px; color:#888; margin-bottom:16px; line-height:1.5; }
        .mkt-cur   { font-size:13px; color:#555; margin-bottom:8px; }
        .mkt-cur strong { color:#1a73e8; font-weight:700; }
        .sc-slider { width:100%; height:5px; -webkit-appearance:none; appearance:none; background:#e0e0e0; border-radius:3px; outline:none; cursor:pointer; }
        .sc-slider::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#1a73e8; cursor:pointer; box-shadow:0 1px 4px rgba(26,115,232,.35); }
        .sc-ticks  { display:flex; justify-content:space-between; font-size:10px; color:#aaa; margin-top:4px; }

        /* 재무 카드 */
        .fin-rate-row   { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
        .fin-rate-label { font-size:13px; color:#555; }
        .fin-rate-badge { background:#E8F0FE; color:#1a73e8; padding:2px 10px; border-radius:20px; font-size:13px; font-weight:700; }
        .fin-impact-row { margin-top:12px; font-size:13px; color:#555; }

        /* 하단 2열 */
        .strat-bottom  { display:grid; grid-template-columns:1.2fr 1fr; gap:14px; margin-bottom:24px; }
        .strat-sim-panel,
        .strat-coach-panel { background:white; border:1px solid #e0e0e0; border-radius:12px; padding:20px; }
        .strat-panel-title { font-size:14px; font-weight:600; color:#111; margin:0 0 14px; }
        .strat-chart-wrap  { height:160px; position:relative; margin-bottom:14px; }
        .sim-metrics { display:flex; flex-direction:column; gap:9px; }
        .sim-metric  { display:flex; align-items:center; gap:8px; }
        .sim-dot     { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .sim-name    { font-size:13px; color:#555; flex:1; }
        .sim-val     { font-size:13px; font-weight:700; color:#111; }

        /* AI 코치 */
        .coach-solar-tag { font-size:10px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:10px; }
        .coach-text { font-size:13px; color:#333; line-height:1.75; margin-bottom:14px; }
        .coach-rec-lbl  { font-size:12px; font-weight:700; color:#111; margin-bottom:8px; }
        .coach-rec-list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:5px; }
        .coach-rec-list li { font-size:12px; color:#555; padding-left:14px; position:relative; line-height:1.55; }
        .coach-rec-list li::before { content:'•'; position:absolute; left:0; color:#1a73e8; font-weight:700; }

        /* ── PLACEHOLDER TAB ── */
        .tab-placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; color:var(--gray-5); text-align:center; }
        .tab-placeholder svg { margin-bottom:16px; }
        .tab-placeholder p { font-size:15px; font-weight:700; color:var(--gray-7); margin-bottom:6px; }
        .tab-placeholder span { font-size:13px; }

        /* ── EVENT TAB ── */
        .ev-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
        .ev-title  { font-size:18px; font-weight:800; color:var(--navy); }
        .ev-month-badge { font-size:11px; font-weight:700; color:var(--blue); background:var(--blue-bg); padding:3px 10px; border-radius:20px; }
        .ev-demo-tag { font-size:9px; color:var(--gray-5); background:var(--gray-2); padding:2px 6px; border-radius:4px; }

        .ev-two-col      { display:grid; grid-template-columns:55% 1fr; gap:14px; margin-bottom:14px; }
        .ev-two-col.even { grid-template-columns:1fr 1fr; }
        .ev-section      { background:white; border:1px solid var(--gray-2); border-radius:12px; padding:18px 20px; }
        .ev-section-title { font-size:13px; font-weight:800; color:var(--navy); margin-bottom:14px; display:flex; align-items:center; gap:6px; }

        .ev-cat-grid  { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .ev-cat       { background:var(--gray-1); border-radius:10px; padding:12px 14px; }
        .ev-cat-label { font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; margin-bottom:10px; }
        .ev-event-list{ display:flex; flex-direction:column; gap:6px; }
        .ev-event-item{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--navy); }

<script>
// ═══════════════════════════════════════════════════════════════
//  상수 (localStorage 기반)
// ═══════════════════════════════════════════════════════════════

const LS = k => localStorage.getItem(k);

let currentMonth = 1;

let growthChartInst = null, patientChartInst = null, expChartInst = null;

// ── 포맷팅 ──
const fmtWon = v => formatKRW(v * 10000); // 백엔드 값은 만원 단위
function badge(pct) {
    if (pct === null) return '';
    const pos = pct >= 0;
    return `<span class="badge ${pos?'pos':'neg'}">${pos?'↑':'↓'}${Math.abs(pct).toFixed(1)}%</span>`;
}
function pctDiff(cur, prev) {
    if (!prev || prev === 0) return null;
    return (cur - prev) / Math.abs(prev) * 100;
}

// ═══════════════════════════════════════════════════════════════
//  KPI
// ═══════════════════════════════════════════════════════════════

function renderKPI() {
    const data = getLatestMonthData();
    const now  = new Date();
    const pad  = n => String(n).padStart(2,'0');

    document.getElementById('sb-month-num').textContent = `M${currentMonth}`;
    document.getElementById('kpi-date').textContent  = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())}`;
    document.getElementById('kpi-month').textContent = `${currentMonth}개월 진행 중`;
    const mbadge = document.getElementById('kpi-month-badge');
    if (mbadge) mbadge.textContent = `Month ${currentMonth}`;

    const simStart = new Date(now.getFullYear(), now.getMonth() - (currentMonth-1), 1);
    const simEnd   = new Date(now.getFullYear(), now.getMonth(), 0);
    const fmt = d => `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
    document.getElementById('date-range-text').textContent = `${fmt(simStart)} ~ ${fmt(simEnd)}`;

    const advLabel = document.getElementById('advance-month-label');
    if (advLabel) advLabel.textContent = `${currentMonth}개월`;
    const btn = document.getElementById('advance-btn');
    if (btn) btn.disabled = currentMonth >= 36;

    if (!data) return;

    document.getElementById('kpi-cash').textContent         = fmtWon(data.cumulativeCash);
    document.getElementById('kpi-cash-badge').innerHTML     = badge(data.cashChangeRate != null ? data.cashChangeRate * 100 : null);
    document.getElementById('kpi-patients').textContent     = (data.patientsCount || 0).toLocaleString() + '명';
    document.getElementById('kpi-daily').textContent        = `일 평균 ${Math.round((data.patientsCount || 0) / 22)}명`;
    document.getElementById('kpi-patients-badge').innerHTML = badge(data.patientsChangeRate != null ? data.patientsChangeRate * 100 : null);
    document.getElementById('kpi-rep').textContent          = data.reputationScore != null ? Number(data.reputationScore).toFixed(1) : '-';
    document.getElementById('kpi-rep-badge').innerHTML      = badge(data.reputationChangeRate != null ? data.reputationChangeRate * 100 : null);
}

// ═══════════════════════════════════════════════════════════════
//  성장 그래프
// ═══════════════════════════════════════════════════════════════

function initGrowthChart() {
    const ctx = document.getElementById('growthChart').getContext('2d');
    if (growthChartInst) { growthChartInst.destroy(); growthChartInst = null; }
    document.getElementById('chart-tip').style.display = 'none';

    const allData = getAllMonthlyData();
    if (allData.length === 0) return;

    document.getElementById('chart-period-label').textContent = allData.length + '개월';
    const labels   = allData.map(d => `M${d.month}`);
    const revenues = allData.map(d => Math.round(d.revenue   || 0));
    const profits  = allData.map(d => Math.round(d.netProfit || 0));

    const hasDecrease = revenues.some((r, i) => i > 0 && r < revenues[i-1]);
    if (hasDecrease) document.getElementById('chart-tip').style.display = 'block';

    growthChartInst = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label:'매출', data:revenues, borderColor:'#1A6BFF', backgroundColor:'rgba(26,107,255,.07)', fill:true, tension:0.42, pointRadius:4, pointHoverRadius:6, pointBackgroundColor:'#1A6BFF', borderWidth:2.5 },
                { label:'순이익', data:profits, borderColor:'#22C97A', backgroundColor:'transparent', fill:false, tension:0.42, pointRadius:4, pointHoverRadius:6, pointBackgroundColor:profits.map(v=>v>=0?'#22C97A':'#FF3B3B'), borderWidth:2.5, segment:{borderColor:ctx=>ctx.p1.parsed.y<0?'#FF3B3B':'#22C97A'} }
            ]
        },
        options: {
            responsive:true, maintainAspectRatio:false,
            interaction:{mode:'index',intersect:false},
            plugins:{
                legend:{position:'top',labels:{font:{family:'Pretendard',weight:'600',size:12},padding:14,usePointStyle:true,pointStyleWidth:10}},
                tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()}만원`}}
            },
            scales:{
                x:{grid:{display:false},ticks:{font:{family:'Pretendard',size:12},color:'#7A8699'}},
                y:{grid:{color:'#E8ECF2'},ticks:{font:{family:'Pretendard',size:12},color:'#7A8699',callback:v=>v.toLocaleString()+'만'}}
            }
        }
    });
}

// ═══════════════════════════════════════════════════════════════
//  환자 유형 도넛
// ═══════════════════════════════════════════════════════════════

function initPatientChart() {
    if (patientChartInst) { patientChartInst.destroy(); patientChartInst = null; }
    const data   = getLatestMonthData();
    const newPts = data ? (data.newPatientCount    || 0) : 0;
    const retPts = data ? (data.returnPatientCount || 0) : 0;
    const total  = newPts + retPts || 1;
    const newPct = Math.round(newPts / total * 100), returnPct = 100 - newPct;
    document.getElementById('donut-return-pct').textContent  = returnPct + '%';
    document.getElementById('legend-new-pct').textContent    = newPct + '%';
    document.getElementById('legend-return-pct').textContent = returnPct + '%';
    patientChartInst = new Chart(document.getElementById('patientChart').getContext('2d'), {
        type:'doughnut',
        data:{ labels:['초진','재진'], datasets:[{data:[newPct,returnPct],backgroundColor:['#1A6BFF','#E8ECF2'],borderWidth:0,hoverOffset:4}] },

function getExpData() {
    const data = getLatestMonthData();
    if (data && data.costBreakdown && Object.keys(data.costBreakdown).length > 0) {
        const COLORS = {
            '인건비':'#1A6BFF', '4대보험':'#4D8EFF', '임대료':'#FF8C42',
            '마케팅비':'#22C97A', '감가상각비':'#C8D0DC', '기타관리비':'#9B59B6',
            '변동비':'#F7C59F', '이자비용':'#E74C3C'
        };
        return Object.entries(data.costBreakdown)
            .filter(([, v]) => v > 0)
            .map(([k, v]) => ({ name: k, amount: v, color: COLORS[k] || '#C8D0DC' }));
    }
    const STAFF_COST = { MIN_STAFF: 860, BALANCED: 1670, SERVICE_ENHANCED: 3340 };
    const os = LS('medsim_operation_style') || 'BALANCED';
    return [
        { name:'인건비',   amount: STAFF_COST[os] ?? 1670,                           color:'#1A6BFF' },
        { name:'임대료',   amount: parseInt(LS('medsim_monthly_rent'))   || 0,       color:'#FF8C42' },
        { name:'마케팅비', amount: parseInt(LS('medsim_marketing_cost')) || 0,       color:'#22C97A' },
        { name:'기타',     amount: 250,                                               color:'#C8D0DC' },
    ].filter(d => d.amount > 0);
}

function initExpChart() {
    if (expChartInst) { expChartInst.destroy(); expChartInst = null; }
    const EXP_DATA = getExpData();
    expChartInst = new Chart(document.getElementById('expChart').getContext('2d'), {
        type:'doughnut',
        data:{ labels:EXP_DATA.map(d=>d.name), datasets:[{data:EXP_DATA.map(d=>d.amount),backgroundColor:EXP_DATA.map(d=>d.color),borderWidth:0,hoverOffset:4}] },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'60%', plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${ctx.parsed.toLocaleString()}만원`}}} }
    });
    document.getElementById('exp-legend').innerHTML = EXP_DATA.map(d =>
        `<div class="exp-row"><span class="exp-dot" style="background:${d.color}"></span><span class="exp-name">${d.name}</span><span class="exp-amt">${d.amount.toLocaleString()}만원</span></div>`
    ).join('');
}

function renderEventCenter() {
    const el     = document.getElementById('event-center-content');
    const events = getNextEvents ? getNextEvents() : [];

    if (!events || events.length === 0) {
        el.innerHTML = `<div class="event-empty">이벤트는 6개월 이후부터 발생합니다.<br>운영 전략 탭에서 다음 달로 진행하세요.</div>`;
        return;
    }

    const rows = events.map(ev => {
        const positive = ev.positive !== undefined ? ev.positive : true;
        const pct      = ev.effectValue != null ? Math.abs(ev.effectValue * 100).toFixed(1) + '%' : '';
        return `<tr>
            <td class="event-name">${ev.description || ev.eventType || '이벤트'}</td>
            <td class="event-val">${ev.effectDescription || pct}</td>
            <td class="event-change"><span class="badge ${positive?'pos':'neg'}">${positive?'↑':'↓'}${pct}</span></td>
        </tr>`;
    }).join('');

    el.innerHTML = `
        <table class="event-table">
            <thead><tr><th>항목</th><th>내용</th><th style="text-align:right">변화</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
}

let stratState = {};
let stratChartInst = null;

const STAFF_DEFAULTS = {
    MIN_STAFF:        { nurse:1, admin:1, radiol:1 },
    BALANCED:         { nurse:2, admin:2, radiol:0 },
    SERVICE_ENHANCED: { nurse:4, admin:3, radiol:1 },
};

function initStratState() {
    const os = LS('medsim_operation_style') || 'BALANCED';
    const currentStaff = JSON.parse(LS('medsim_staff_counts')         || 'null');
    const initialStaff = JSON.parse(LS('medsim_initial_staff_counts') || 'null');
    const staffCounts  = currentStaff || initialStaff || { ...STAFF_DEFAULTS[os] };
    stratState = {
        operationStyle:     os,
        staffCounts,
        clinicStyle:        LS('medsim_clinic_style')     || 'FAST_TURNOVER',
        operationHours:     LS('medsim_operation_hours')  || 'STANDARD',
        services:           JSON.parse(LS('medsim_services')     || '["endoscope_upper"]'),
        marketingCost:      parseInt(LS('medsim_marketing_cost')) || 0,
        repaymentStyle:     LS('medsim_repayment_style')  || 'BALANCED',
        reputationPrograms: JSON.parse(LS('medsim_rep_programs')  || '["revisit_sms"]'),
    };
    console.log('[운영 전략 탭 로드]', {
        현재_staff_counts: LS('medsim_staff_counts'),
        초기_staff_counts: LS('medsim_initial_staff_counts'),
        화면_표시값: stratState.staffCounts,
    });
}

function selectOpStyle(v) {
    if (stratState.operationStyle !== v) {
        stratState.staffCounts = { ...STAFF_DEFAULTS[v] };
    }
    stratState.operationStyle = v;
    renderStrategyTab();
}
function selectClinicStyle(v) { stratState.clinicStyle    = v; renderStrategyTab(); }
function selectOpHours(v)     { stratState.operationHours = v; renderStrategyTab(); }
function selectRepayment(v)   { stratState.repaymentStyle = v; renderStrategyTab(); }

function updateMarketing(v) {
    stratState.marketingCost = parseInt(v) || 0;
    const cur = document.getElementById('mkt-cur-val');
    if (cur) cur.textContent = stratState.marketingCost.toLocaleString() + '만원';
    const descEl = document.getElementById('mkt-desc');
    if (descEl) descEl.textContent = _mktDesc(stratState.marketingCost);
    const ptEl = document.getElementById('mkt-patient');
    if (ptEl) ptEl.innerHTML = _mktPatientHtml(stratState.marketingCost);
    const ib = document.getElementById('mkt-impacts');
    if (ib) ib.innerHTML = _mktImpactHtml(stratState.marketingCost);
}
function _mktDesc(mkt) {
    if (mkt >= 2000) return '공격적 마케팅, 초기 환자 유입 극대화';
    if (mkt >= 1000) return '적극적 기획마케팅 + 지역 광고';
    if (mkt >=  300) return '인라인 광고 + 블로그 마케팅';
    if (mkt >     0) return '기본 SNS 운영 수준';
    return '마케팅 없음';
}
function _mktPatientHtml(mkt) {
    if (mkt >= 2000) return '<span class="ibadge pos">+5명/일 이상 (월 125명 추가)</span>';
    if (mkt >= 1000) return '<span class="ibadge pos">+3명/일 이상 (월 75명 추가)</span>';
    if (mkt >=  500) return '<span class="ibadge pos">+1명/일 이상 (월 25명 추가)</span>';
    if (mkt >=  300) return '<span class="ibadge pos">+0.5명/일 (월 12명 추가)</span>';
    return '<span style="font-size:12px;color:#aaa">효과 없음</span>';
}
function _mktImpactHtml(mkt) {
    if (mkt >= 3000) return '<span class="ibadge pos">신환 유입 +30%</span><span class="ibadge pos">성장 가속 +4개월</span><span class="ibadge neg">월비용 +3,000만원</span>';
    if (mkt >= 1000) return `<span class="ibadge pos">신환 유입 +15%</span><span class="ibadge pos">성장 가속 +2개월</span><span class="ibadge neg">월비용 +${mkt.toLocaleString()}만원</span>`;
    if (mkt >=  500) return `<span class="ibadge pos">신환 유입 +5%</span><span class="ibadge pos">성장 가속 +1개월</span><span class="ibadge neg">월비용 +${mkt.toLocaleString()}만원</span>`;
    return '<span style="font-size:12px;color:#aaa">마케팅 비용 없음</span>';
}

function toggleService(id) {
    const idx = stratState.services.indexOf(id);
    if (idx >= 0) stratState.services.splice(idx, 1); else stratState.services.push(id);
    renderStrategyTab();
}
function toggleRepProg(id) {
    const idx = stratState.reputationPrograms.indexOf(id);
    if (idx >= 0) stratState.reputationPrograms.splice(idx, 1); else stratState.reputationPrograms.push(id);
    renderStrategyTab();
}
function resetStrategy() {
    initStratState();
    renderStrategyTab();
    showToast('전략이 초기화되었습니다.');
}

// ── 인라인 라디오 헬퍼 ──
function _irGroup(items, curVal, onClickFn) {
    return `<div class="ir-group">${items.map(([k, lbl]) => {
        const on = curVal === k;
        return `<div class="ir-item${on?' on':''}" onclick="${onClickFn}('${k}')">
            <span class="ir-dot${on?' on':''}">${on?'<span class="ir-dot-in"></span>':''}</span>
            <span class="ir-label">${lbl}</span>
        </div>`;
    }).join('')}</div>`;
}
// ── 체크박스 헬퍼 ──
function _cbSvg() { return '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'; }

// ── 카드 1: 인력 운영 스타일 ──
const STAFF_WAGE = { nurse: 300, admin: 250, radiol: 350 };

function _calcStaffCost(sc) {
    return (sc.nurse||0)*STAFF_WAGE.nurse + (sc.admin||0)*STAFF_WAGE.admin + (sc.radiol||0)*STAFF_WAGE.radiol;
}

function changeStaff(role, delta) {
    stratState.staffCounts[role] = Math.max(0, (stratState.staffCounts[role] || 0) + delta);
    const el = document.getElementById('sc-' + role);
    if (el) el.textContent = stratState.staffCounts[role] + '명';
    const costEl = document.getElementById('sc-total-cost');
    if (costEl) costEl.textContent = _calcStaffCost(stratState.staffCounts).toLocaleString() + '만원/월';
}

    const os = stratState.operationStyle;
    const sc = stratState.staffCounts;

    const radioHtml = _irGroup([
        ['MIN_STAFF','최소 인력 운영'],['BALANCED','균형 운영'],['SERVICE_ENHANCED','서비스 강화형']
    ], os, 'selectOpStyle');

    const staffHtml = `<div class="staff-steppers">
        ${[['nurse','간호사'],['admin','원무'],['radiol','방사선사']].map(([k,n]) => `
        <div class="staff-row">
            <span class="staff-name">${n}</span>

    </div>
    <div style="font-size:12px;color:#555;margin-bottom:4px">현재 인건비: <strong id="sc-total-cost">${staffCost.toLocaleString()}만원/월</strong></div>`;

    const impMap = {
        MIN_STAFF:        [['인건비 절감',true],['대기시간 +8분',false],['환자만족도 -5%',false],['재진률 -2.3%',false]],
        BALANCED:         [['인건비 기본',true],['대기시간 기본',true],['안정적 운영',true]],

        </div>
    </div>`;
}

    return `<div class="strat-card">
        <div class="strat-card-title">서비스 / 장비 확장</div>

            <div class="impact-lbl">예상 변화</div>

        if (mkt < 500) recs.push('월 마케팅 비용 500만원 이상 투자를 권장합니다');

        recs.push('재진 알림 문자와 리뷰 관리로 재방문율을 높이세요');
        recs.push('잉여 현금으로 고수익 서비스 장비 추가를 검토하세요');
        recs.push('대출이 있다면 공격 상환으로 이자 부담을 줄이세요');
    } else {
        mainText = `${currentMonth}개월차 운영 중입니다. 설정한 전략이 다음 달 결과에 반영됩니다.`;
        recs.push('진료 스타일과 상권 특성을 맞춰 환자 유입을 최적화하세요');
        recs.push('개원 초기일수록 마케팅 투자의 ROI가 높습니다');

    const allData = getAllMonthlyData();

        data:{ labels, datasets:[

            plugins:{

function updateTabBadges() {
    const eventBadge   = document.getElementById('badge-event');
    const historyBadge = document.getElementById('badge-history');

    if (eventBadge) {
        if (currentMonth < 6) {
            eventBadge.style.display = 'none';
        } else {
            const simId = (typeof getSimulationId === 'function') ? getSimulationId() || '' : '';
            const derivedEvs = (typeof _getDerivedEvents === 'function') ? _getDerivedEvents(simId, currentMonth) : [];
            const unifiedIds = new Set();
            (getAllMonthlyData ? getAllMonthlyData() : []).forEach(r => {
                (r.activeEvents||[]).forEach(ev => {
                    const k = ev.type || ev.eventType || '';
                    const mapped = (typeof EV_TYPE_MAP !== 'undefined') ? EV_TYPE_MAP[k] : null;
                    if (mapped) unifiedIds.add(mapped);
                });
            });
            derivedEvs.filter(d => d.month <= currentMonth).forEach(d => unifiedIds.add(d.id));
            const count = unifiedIds.size;
            if (count === 0) {
                eventBadge.style.display = 'none';
            } else {
                eventBadge.textContent = count > 99 ? '99+' : String(count);
                eventBadge.style.display = '';
            }
        }
    }

    const allData = getAllMonthlyData ? getAllMonthlyData() : [];
    if (historyBadge) {
        if (allData.length === 0) {
            historyBadge.style.display = 'none';
        } else {
            historyBadge.textContent = allData.length > 99 ? '99+' : String(allData.length);
            historyBadge.style.display = '';
        }
    }
}

function switchTab(tabName, el) {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    if (el) el.classList.add('active');
    else document.querySelector(`.tab-item[data-tab="${tabName}"]`)?.classList.add('active');
    document.getElementById('tab-' + tabName)?.classList.add('active');
    if (tabName === '운영전략') renderStrategyTab();
    if (tabName === '이력')    renderHistoryTab();
    if (tabName === '이벤트')  renderEventTab();
}

async function advanceMonth() {
    if (currentMonth >= 36) { showToast('36개월 시뮬레이션이 완료되었습니다.'); return; }

    localStorage.setItem('medsim_operation_style', stratState.operationStyle);
    localStorage.setItem('medsim_staff_counts',    JSON.stringify(stratState.staffCounts));
    localStorage.setItem('medsim_clinic_style',    stratState.clinicStyle);
    localStorage.setItem('medsim_operation_hours', stratState.operationHours);
    localStorage.setItem('medsim_services',        JSON.stringify(stratState.services));
    localStorage.setItem('medsim_marketing_cost',  String(stratState.marketingCost));
    localStorage.setItem('medsim_repayment_style', stratState.repaymentStyle);
    localStorage.setItem('medsim_rep_programs',    JSON.stringify(stratState.reputationPrograms));

    const btn = document.getElementById('advance-btn');
    if (btn) { btn.disabled = true; btn.textContent = '처리 중...'; }

    try {
        const simulationId = getSimulationId();
        if (!simulationId) { showToast('시뮬레이션 ID를 찾을 수 없습니다.'); return; }

        const decisions   = getAvailableDecisions ? getAvailableDecisions() : [];
        const decisionIds = decisions.map(d => d.id || d.decisionId).filter(Boolean);

        const result = await apiPost(`/api/simulation/${simulationId}/next`, decisionIds);

        appendMonthlyData(result.monthlyData);
        currentMonth = result.currentMonth;
        localStorage.setItem('currentMonth', String(currentMonth));
        localStorage.setItem('medsim_next_events',         JSON.stringify(result.nextEvents         || []));
        localStorage.setItem('medsim_available_decisions', JSON.stringify(result.availableDecisions || []));

        if (result.isBankrupt) {
            showToast('파산! 현금이 부족하여 운영을 지속할 수 없습니다.');
        } else if (result.isCompleted) {
            showToast('36개월 시뮬레이션이 완료되었습니다!');
        }
    } catch (e) {
        showToast('오류: ' + (e.message || '서버와 통신할 수 없습니다.'));
        if (btn) { btn.disabled = currentMonth >= 36; btn.textContent = '진행하기 →'; }
        return;
    }

    if (btn) { btn.disabled = currentMonth >= 36; btn.textContent = '진행하기 →'; }

    updateTabBadges();
    renderKPI();
    renderEventCenter();
    if (growthChartInst)  { growthChartInst.destroy();  growthChartInst = null; }
    if (patientChartInst) { patientChartInst.destroy(); patientChartInst = null; }
    if (expChartInst)     { expChartInst.destroy();     expChartInst = null; }
    initGrowthChart();
    initPatientChart();
    initExpChart();
    switchTab('요약');
}

function _evRand(seed, n) {
    const x = Math.sin(seed * 9301 + n * 49297 + 233) * 10000;
    return x - Math.floor(x);
}

function _getDerivedEvents(simId, upToMonth) {
    const POOL = EV_CATS.flatMap(c => c.items.map(i => ({...i, cat:c.id})));
    const cps  = [6,12,18,24,30,36].filter(m => m <= upToMonth);
    const seed = simId ? simId.split('').reduce((a,c) => a*31 + c.charCodeAt(0), 7) : 12345;
    const result = [];
    cps.forEach((month, idx) => {
        const i1 = Math.floor(_evRand(seed, idx*2)   * POOL.length);
        const i2 = (i1+1+Math.floor(_evRand(seed, idx*2+1) * (POOL.length-1))) % POOL.length;
        [POOL[i1], POOL[i2]].forEach(ev => result.push({month, ...ev}));
    });
    return result;
}

function _collectActiveIds() {
    const ids = new Set();
    getAllMonthlyData().forEach(r => {
        (r.activeEvents||[]).forEach(ev => {
            const k = ev.type || ev.eventType || '';
            const mapped = EV_TYPE_MAP[k];
            if (mapped) ids.add(mapped);
        });
    });
    return ids;
}

function _collectTimeline() {
    const result = [];
    getAllMonthlyData().forEach(r => {
        (r.activeEvents||[]).forEach(ev => {
            result.push({
                month: r.month,
                name: ev.title || ev.description || '이벤트',
                neg: ev.severity==='HIGH' || (ev.impactMap && ev.impactMap.revenueMultiplier < 1),
            });
        });
    });
    return result;
}

function selectEvResponse(id) {
    selectedEvResponse = id;
    document.querySelectorAll('.ev-resp-item').forEach(el => {
        const on = el.dataset.id === id;
        el.classList.toggle('selected', on);
        const dot = el.querySelector('.ev-resp-radio');
        dot.classList.toggle('on', on);
        dot.innerHTML = on ? '<span class="ev-resp-radio-dot"></span>' : '';
    });
    const resp = EV_RESPONSES.find(r => r.id === id);
    const box  = document.getElementById('ev-impact-badges');
    if (resp && box) {
        box.innerHTML = resp.effects.map(e =>
            `<span class="ibadge ${e.pos?'pos':'neg'} sm">${e.t} ${e.v}</span>`
        ).join('');
    }
}

        type: 'line',
        data: {
            labels: all.map(d => 'M'+d.month),

                { label:'매출',   data:all.map(d=>d.revenue   ||0), borderColor:'#1A6BFF', backgroundColor:'rgba(26,107,255,.07)', fill:true,  tension:0.4, pointRadius:3, borderWidth:2 },

                  segment:{borderColor:ctx=>ctx.p1.parsed.y<0?'#FF3B3B':'#22C97A'} },

            responsive:true, maintainAspectRatio:false,

            plugins:{
                legend:{position:'top',labels:{font:{family:'Pretendard',weight:'600',size:11},padding:12,usePointStyle:true}},

            scales:{

            }
        }
    });
}

function _initEvCompareChart(last, rep, seed) {
    const canvas = document.getElementById('ev-compare-chart');
    if (!canvas) return;
    const r1 = 0.82 + _evRand(seed,10) * 0.36;
    const r2 = 0.78 + _evRand(seed,11) * 0.40;
    const r3 = 62   + Math.floor(_evRand(seed,12) * 22);
    const myPat = last ? Math.max(1, Math.round((last.patientsCount||0)/22)) : 20;
    const myRev = last ? Math.min(100, Math.round((last.revenue||0)/150))   : 50;
    const myMor = last ? Math.round((last.staffMorale||0.7)*100)            : 70;
    evCompChart = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: {
            labels: ['일 환자수(명)', '평판(×20)', '매출지수', '직원사기'],
            datasets: [
                { label:'우리 병원',  data:[myPat, Math.round(rep*20), myRev, myMor],                                                       backgroundColor:'rgba(26,107,255,.72)', borderRadius:4 },
                { label:'경쟁 병원', data:[Math.round(myPat*r1), Math.round(rep*20*r2), Math.round(myRev*r2), r3], backgroundColor:'rgba(200,208,220,.8)', borderRadius:4 },
            ]
        },
        options: {
            responsive:true, maintainAspectRatio:false,
            plugins:{legend:{position:'top',labels:{font:{family:'Pretendard',weight:'600',size:11},padding:12,usePointStyle:true}}},
            scales:{
                x:{grid:{display:false},ticks:{font:{family:'Pretendard',size:10},color:'#7A8699',maxRotation:0}},
                y:{beginAtZero:true,grid:{color:'#E8ECF2'},ticks:{font:{family:'Pretendard',size:11},color:'#7A8699'}},
            }
        }
    });
}

function _initEvKakaoMap() {
    if (typeof kakao === 'undefined') return;
    const container = document.getElementById('ev-kakao-map');
    if (!container) return;
    const sg = LS('medsim_sigungu') || '';
    const COORDS = {'강남구':[37.5175,127.0473],'서초구':[37.4837,127.0324],'송파구':[37.5145,127.1059],'마포구':[37.5663,126.9018],'종로구':[37.5730,126.9794],'중구':[37.5640,126.9977],'노원구':[37.6542,127.0568],'관악구':[37.4784,126.9516]};
    const center = COORDS[sg] || [37.5175,127.0473];
    try {
        if (!evKakaoMapObj) {
            evKakaoMapObj = new kakao.maps.Map(container, { center:new kakao.maps.LatLng(center[0],center[1]), level:5 });
        } else {
            evKakaoMapObj.setCenter(new kakao.maps.LatLng(center[0],center[1]));
        }
        new kakao.maps.Circle({ map:evKakaoMapObj, center:new kakao.maps.LatLng(center[0],center[1]), radius:1000, strokeWeight:2, strokeColor:'#FF3B3B', strokeOpacity:0.6, fillColor:'#FF3B3B', fillOpacity:0.05 });
        const marker = new kakao.maps.Marker({ position:new kakao.maps.LatLng(center[0],center[1]), map:evKakaoMapObj });
        const iw = new kakao.maps.InfoWindow({ content:'<div style="padding:4px 8px;font-size:11px;font-family:Pretendard,sans-serif;font-weight:700;white-space:nowrap">우리 병원</div>' });
        iw.open(evKakaoMapObj, marker);
    } catch(e) { console.warn('Kakao map error', e); }
}

function dismissChartTip() { document.getElementById('chart-tip').style.display='none'; }
function acceptChartTip()  { dismissChartTip(); showToast('AI 분석 기능은 준비 중입니다.'); }

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
}

// ═══════════════════════════════════════════════════════════════
//  온보딩
// ═══════════════════════════════════════════════════════════════

const ONB_STEPS = [
    { label:'STEP 1', imgStep:'1 / 4', title:'Month 1: 결과를 확인하고 전략을 설정하세요', desc:'병원이 오픈했습니다. 첫 환자를 기다리는 중입니다.',
      svg:'<path d="M3 9.5A6.5 6.5 0 0112 3.5M12 3.5A6.5 6.5 0 0121 9.5M3 9.5v5A6.5 6.5 0 0012 21m0 0a6.5 6.5 0 009-5.5V9.5M12 12v4"/>' },
    { label:'STEP 2', imgStep:'2 / 4', title:'변수를 입력합니다', desc:'매달 달라지는 병원 운영 결과에 따라 전략을 조정해보세요.',
      svg:'<circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 1012 2"/><line x1="12" y1="2" x2="12" y2="6"/>' },
    { label:'STEP 3', imgStep:'3 / 4', title:'이벤트가 발생합니다', desc:'개원 후 6개월이 지나면 다양한 이벤트가 발생합니다.',
      svg:'<path d="M13 10V3L4 14h7v7l9-11h-7z"/>' },
    { label:'STEP 4', imgStep:'4 / 4', title:'36개월 경영을 실제 개원에 적용해보세요', desc:'의료 경영 전문가의 인사이트가 담긴 MEDSIM만의 분석 리포트로 실제 개원에 도움을 얻으세요.',
      svg:'<path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0121 9.414V19a2 2 0 01-2 2z"/>' }
];

let onbStep = 0;
function renderStep(idx) {
    const s = ONB_STEPS[idx];
    document.getElementById('onb-step-label').textContent = s.label;
    document.getElementById('onb-title').textContent      = s.title;
    document.getElementById('onb-desc').textContent       = s.desc;
    document.getElementById('onb-img-step').textContent   = s.imgStep;
    document.getElementById('onb-svg').innerHTML          = s.svg;
    document.getElementById('onb-dots').innerHTML = ONB_STEPS.map((_,i) =>
        `<span class="onb-dot${i===idx?' active':''}" onclick="onbGoto(${i})"></span>`
    ).join('');
    document.getElementById('onb-prev').disabled    = idx === 0;
    document.getElementById('onb-next').textContent = idx === ONB_STEPS.length-1 ? '시작하기' : '다음';
}
function onbNext()      { if (onbStep < ONB_STEPS.length-1) { onbStep++; renderStep(onbStep); } else closeOnboarding(); }
function onbPrev()      { if (onbStep > 0) { onbStep--; renderStep(onbStep); } }
function onbGoto(idx)   { onbStep = idx; renderStep(onbStep); }
function closeOnboarding() {
    localStorage.setItem('onboardingShown','true');
    const el = document.getElementById('onb-overlay');
    el.style.animation = 'fadeIn .18s ease reverse';
    setTimeout(() => el.classList.add('hidden'), 160);
}

window.addEventListener('load', () => {
    currentMonth = parseInt(localStorage.getItem('currentMonth') || '1') || 1;

    if (!hasSimulationData() && !getSimulationId()) {
        document.body.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Pretendard,sans-serif;gap:16px">
            <p style="font-size:18px;color:#333">시뮬레이션을 먼저 시작해주세요</p>
            <a href="/start/start2.html" style="color:#1A6BFF;text-decoration:underline">시작하기 →</a>
        </div>`;
        return;
    }

    initStratState();
    renderKPI();
    renderEventCenter();
    updateTabBadges();
    renderHistoryTab();
    initGrowthChart();
    initPatientChart();
    initExpChart();

    const params = new URLSearchParams(window.location.search);
    if (params.get('resetOnboarding') === 'true') localStorage.removeItem('onboardingShown');

    if (localStorage.getItem('onboardingShown') === 'true') {
        document.getElementById('onb-overlay').classList.add('hidden');
    } else {
        onbStep = 0;
        renderStep(0);
    }
});
</script>
